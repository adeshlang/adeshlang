[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adesh-ai"
version = "0.3.0"
description = "Lightweight AI/LLM infrastructure specialized for AdeshLang"
readme = "README.md"
authors = [
    { name = "Ajay Tainwala", email = "dev@adeshlang.org" }
]
license = { text = "MIT / AdeshLang v2.0" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.4.0",
    "accelerate>=0.20.0",
]
inference = [
    "torch>=2.0.0",
]
export = [
    "onnx>=1.14.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dataset*", "training*", "evaluation*", "inference*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[package]
name = "als"
version = "0.1.0"
edition = "2021"
description = "Adesh Language Server - LSP implementation for the Adesh programming language"
license = "MIT"
authors = ["Adesh Team"]

[lints]
workspace = true

[dependencies]
# LSP Protocol
lsp-server = "0.7"
lsp-types = "0.95"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Adesh core (path dependency to main crate)
adeshlang = { path = ".." }

# Async runtime for performance
crossbeam-channel = "0.5"

# File watching
notify = "6.1"

# Thread pool for parallel processing
rayon = "1.10"

# Performance timing
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "als"
path = "src/main.rs"

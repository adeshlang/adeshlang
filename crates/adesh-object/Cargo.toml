[package]
name = "adesh-object"
version = "0.1.0"
edition = "2024"
authors = ["AdeshLang Contributors"]
description = "Universal ADOB (Adesh Native Object Binary) format specification, reader, writer, and validation library"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[package]
name = "adesh-runtime"
version = "0.3.0"
edition = "2024"
authors = ["Ajay Tainwala"]
description = "Standalone native runtime library for Adesh programming language"

[lints]
workspace = true

[lib]
name = "adesh_runtime"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
colored = "2.0"
libc = "0.2"

[build-dependencies]
cc = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

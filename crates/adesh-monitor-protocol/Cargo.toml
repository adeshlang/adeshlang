[package]
name = "adesh-monitor-protocol"
version = "0.1.0"
edition = "2024"
authors = ["AdeshLang Contributors"]
description = "Versioned event schemas and IPC protocol for Adesh Observatory (ARO)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

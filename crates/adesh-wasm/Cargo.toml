[package]
name = "adesh-wasm"
version = "0.3.0"
edition = "2024"
authors = ["Ajay Tainwala"]
description = "WebAssembly runtime for Adesh programming language"

[lints]
workspace = true

[lib]
name = "adesh_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Lean build: the `monitor` (ARO observatory) and `mimalloc` features are
# native-only (SQLite, terminal backends, OS allocators) and must stay out
# of WebAssembly builds.
adeshlang = { path = "../../", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1"
# `custom` (not `js`) so the wasm module stays free of wasm-bindgen glue and
# loads through the plain C-ABI loader; the shim is registered in src/lib.rs.
getrandom = { version = "0.2", features = ["custom"] }

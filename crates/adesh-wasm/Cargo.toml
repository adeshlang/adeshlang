[package]
name = "adesh-wasm"
version = "0.3.0"
edition = "2024"
authors = ["Ajay Tainwala"]
description = "WebAssembly runtime for Adesh programming language"

[lints]
workspace = true

[lib]
name = "adesh_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
adeshlang = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1"
getrandom = { version = "0.2", features = ["js"] }

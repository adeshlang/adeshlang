[package]
name = "adesh-monitor-core"
version = "0.1.0"
edition = "2024"
authors = ["AdeshLang Contributors"]
description = "Core monitoring engine, SQLite durable history, and IPC collector for Adesh Observatory (ARO)"
license = "Apache-2.0"

[dependencies]
adesh-monitor-protocol = { path = "../adesh-monitor-protocol" }
adesh-monitor-platform = { path = "../adesh-monitor-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
regex = "1.9"
uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"


[package]
name = "adesh-monitor-cli"
version = "0.1.0"
edition = "2024"
authors = ["AdeshLang Contributors"]
description = "Scriptable CLI and monitoring tool for Adesh Observatory (ARO)"
license = "Apache-2.0"

[lib]
name = "adesh_monitor_cli"
path = "src/lib.rs"

[[bin]]
name = "aro"
path = "src/main.rs"

[dependencies]
adesh-monitor-protocol = { path = "../adesh-monitor-protocol" }
adesh-monitor-platform = { path = "../adesh-monitor-platform" }
adesh-monitor-core = { path = "../adesh-monitor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4" }

[dev-dependencies]
tempfile = "3"

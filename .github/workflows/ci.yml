name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'als/**'
      - 'editor/**'
      - 'crates/**'
      - 'mobile/bridge/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'build.rs'
      - '**.rs'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'als/**'
      - 'editor/**'
      - 'crates/**'
      - 'mobile/bridge/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'build.rs'
      - '**.rs'
  workflow_dispatch:

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features
        continue-on-error: true

      - name: Test library
        run: cargo test --lib

      - name: Build adesh binary and runtime library
        run: cargo build --lib --bin adesh

      - name: Test integration suites
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --tests

      # The native x86-64 e2e suites (Machine IR -> codegen -> ADOB -> PE link
      # -> execute) are `cfg(windows)`-gated, so the ubuntu-only
      # `cargo test --tests` step above never executes them. Run each suite
      # individually on Windows to keep the native pipeline covered. The
      # semantics suite also executes linked binaries that import `aot_*`
      # symbols, so the runtime staticlib must be built first.
      - name: Test native x86-64 e2e suites (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p adesh-runtime
          cargo test --test native_x86_64_e2e_test
          cargo test --test native_parallel_move_e2e_test
          cargo test --test native_phase2_lowering_e2e_test
          cargo test --test native_phase3_fp_e2e_test
          cargo test --test native_phase4_regalloc_e2e_test
          cargo test --test native_phase5_optimization_e2e_test
          cargo test --test native_phase6_compiler_e2e_test
          cargo test --test native_phase6_lto_e2e_test
          cargo test --test native_phase6_abi_e2e_test
          cargo test --test native_phase6_linker_e2e_test
          cargo test --test native_phase7_simd_e2e_test
          cargo test --test native_phase7_pgo_e2e_test
          cargo test --test native_phase7_aarch64_e2e_test
          cargo test --test native_phase7_riscv64_e2e_test
          cargo test --test native_phase7_atomic_e2e_test
          cargo test --test native_phase7_cross_target_test
          cargo test --test native_semantics_e2e_test

      - name: Display sccache stats
        shell: bash
        run: sccache --show-stats
        if: always()



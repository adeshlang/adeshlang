name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Logo/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Logo/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test library
        run: cargo test --lib

      - name: Build library and binary
        run: cargo build --bin adesh --lib

      - name: Test integration suites
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --tests

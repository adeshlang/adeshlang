name: CI

# PR/main gates: light host smoke + workspace compile/clippy/lib tests +
# ecosystem crate builds + cargo-audit. The full desktop / foreign / musl /
# checks / archives matrix stays on-demand — it is too expensive for every PR.
# Tagged/release builds are covered by the separate release workflow.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Official destination repo (overridable).
env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Thin PR/main gate: fmt + clippy correctness + one short host smoke.
  # Does not run the desktop / foreign / musl matrix.
  light-gate:
    name: Light checks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    # sccache-action exports RUSTC_WRAPPER + SCCACHE_GHA_* onto GITHUB_ENV;
    # do not set RUSTC_WRAPPER at job scope before the binary exists (that
    # caused 0% hit / write-error storms on the Mach-O gates).
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      # Absolute RUSTC_WRAPPER: the action's GITHUB_ENV export was missing on
      # macos runners (0 compile requests). Point cargo at the installed binary.
      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Shared with workspace-gate so PR re-runs reuse the same Ubuntu target/registry.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ubuntu-pr-gate
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy correctness (adeshlang)
        run: cargo clippy -p adeshlang -- -D clippy::correctness

      # Phase 7 AOT smoke links against libadesh_runtime.a; clippy alone does
      # not produce the staticlib, so build it before the corpus runs.
      - name: Build host runtime archive
        run: cargo build -p adesh-runtime

      - name: Host smoke (Phase 7 conformance corpus)
        run: cargo test --test native_phase7_conformance_corpus_test -- --nocapture --test-threads=1

      # Phase 18 slice 0: source `extern "C"` → libc puts on the Linux host.
      - name: Host smoke (Phase 18 source extern C)
        run: cargo test --test native_phase18_source_extern_c_test -- --nocapture --test-threads=1

      # Phase 18 TLS / atomics Linux host smoke (Win/macOS cases SKIP here).
      - name: Host smoke (Phase 18 source TLS + atomics)
        run: |
          cargo test --test native_phase18_source_tls_test -- --nocapture --test-threads=1
          cargo test --test native_phase18_source_atomic_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        run: sccache --show-stats

  # PR/main workspace gate: catches breakage in als / wasm / monitor / linker
  # that the light smoke never builds. Full OS matrix stays dispatch-only.
  workspace-gate:
    name: Workspace checks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Shared with light-gate (same host / lockfile / overlapping crates).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ubuntu-pr-gate
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Workspace compile
        run: cargo check --workspace

      - name: Workspace clippy (correctness deny)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Core library tests
        run: |
          cargo test -p adeshlang --lib -- --test-threads=2
          # Single-threaded: audit_* tests assert exact global handle counts.
          cargo test -p adesh-runtime --lib -- --test-threads=1
          cargo test -p adesh-format --lib
          cargo test -p adesh-object --lib
          cargo test -p adesh-codegen --lib
          cargo test -p adesh-linker --lib

      - name: Ecosystem crate builds
        run: |
          cargo build -p als
          cargo build -p adesh-wasm
          cargo build -p adesh-monitor-protocol
          cargo build -p adesh-monitor-platform
          cargo build -p adesh-monitor-core
          cargo build -p adesh-monitor-cli
          cargo build -p adesh-monitor-tui

      - name: Display sccache stats
        if: always()
        run: sccache --show-stats

  # Advisory DB scan on every PR/push (fails on unpatched vulnerabilities).
  cargo-audit:
    name: cargo audit
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Avoid rebuilding cargo-audit from source on every PR (~minutes saved).
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          # Bump the -vN suffix when forcing a newer cargo-audit binary.
          key: cargo-audit-bin-${{ runner.os }}-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # Warm advisory-db across runs; cargo audit still refreshes when stale.
      - name: Cache advisory database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            advisory-db-${{ runner.os }}-

      - name: Audit dependencies
        run: cargo audit

  # Phase 16 close-out: real dyld on both Apple CI arches (intel + arm).
  # Slimmer than full desktop-execution — only Mach-O structural + Phase 13/16
  # host suites. Runs on every PR/push so TLV/`dlopen`/`codesign` cannot stay
  # "pending dispatch".
  macho-dyld-gate:
    name: Mach-O dyld gate (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Persist registry+target even on failure (Phase 13 used to leave the
    # next push cold). sccache-action owns RUSTC_WRAPPER via GITHUB_ENV.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: macho-dyld-gate-${{ matrix.target }}
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Build the host runtime
        run: cargo build -p adesh-runtime

      - name: Mach-O structural (dyld bind + Phase 16 hardening)
        run: cargo test -p adesh-linker --test macho_dyld_binding_test --test macho_phase16_hardening_test -- --nocapture

      - name: Phase 13 Mach-O source link-and-run
        run: cargo test --test native_phase13_macho_exec_test -- --nocapture --test-threads=1

      # Phase 16 is the dyld TLV/`dlopen` host gate; run it even when Phase 13
      # fails so a source-runtime regression cannot hide a linker dyld gap.
      - name: Phase 16 Mach-O dyld (TLV + dlopen)
        if: ${{ !cancelled() }}
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase16_macho_exec_test -- --nocapture --test-threads=1

      # Phase 18 slice: source-level `extern "C" puts` under real dyld / libSystem.
      - name: Phase 18 source extern C (libSystem puts)
        if: ${{ !cancelled() }}
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase18_source_extern_c_test -- --nocapture --test-threads=1 phase18_puts_executes_via_libsystem_on_macos

      # Phase 18 source `thread_local let` via Mach-O TLV / `__tlv_bootstrap`.
      - name: Phase 18 source TLS (Mach-O TLV)
        if: ${{ !cancelled() }}
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase18_source_tls_test -- --nocapture --test-threads=1 phase18_thread_local_exits_42_on_macos_host

      - name: Display sccache stats
        if: always()
        run: sccache --show-stats

  # Slim Windows PE host gate (mirrors macho-dyld-gate): Phase 18 source
  # `puts` + `thread_local` under real msvcrt / TEB TLS. Full desktop matrix
  # stays dispatch-only.
  windows-pe-gate:
    name: Windows PE gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      # Prefer SCCACHE_PATH from the action: `command -v sccache` under Git
      # bash yields an MSYS `/c/...` path that PowerShell cargo cannot exec
      # (`D:/c/hostedtoolcache/...` → os error 3).
      - name: Enable sccache for cargo
        shell: bash
        run: |
          if [[ -n "${SCCACHE_PATH:-}" ]]; then
            echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> "$GITHUB_ENV"
          else
            echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          fi
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: windows-pe-gate
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Build the host runtime
        run: cargo build -p adesh-runtime

      - name: Phase 2 PE TLS e2e
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase2_abi_tls_test -- --nocapture --test-threads=1

      - name: Phase 18 source extern C (msvcrt puts)
        if: ${{ !cancelled() }}
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase18_source_extern_c_test -- --nocapture --test-threads=1 phase18_puts_executes_via_msvcrt_on_windows

      - name: Phase 18 source TLS (TEB)
        if: ${{ !cancelled() }}
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase18_source_tls_test -- --nocapture --test-threads=1 phase18_thread_local_exits_42_on_windows_x86_64

      - name: Display sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  # Keep desktop execution independent of formatting/lint checks. Those remain
  # required in `checks`, but a style failure must not hide a loader regression.
  # Dispatch-only: not part of the PR light gate.
  desktop-execution:
    name: Desktop native execution (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ADESH_DESKTOP_TEST_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: desktop-execution-${{ matrix.target }}
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Build the host runtime
        run: cargo build -p adesh-runtime

      - name: Execute CLI-built desktop programs (default and fast)
        run: cargo test --test native_desktop_output_paths_test --test native_desktop_exec_test -- --nocapture --test-threads=1

      # Both architectures are parsed and their signature ranges/hashes checked
      # on every host. The source suite above also verifies the exact emitted
      # signature with Apple's codesign, without replacing it, on each Mac.
      - name: Verify Mach-O dyld and mapped code-signature structure
        run: cargo test -p adesh-linker --test macho_dyld_binding_test --test macho_phase16_hardening_test --test aot_runtime_linking_regression_test -- --nocapture

      # Phase 13 item 4: dedicated Mach-O link-and-run gate on the runner's
      # native Apple triple (build -> dyld -> execute, asserted stdout/exit +
      # codesign --verify). hello/print exercises a real dyld-bound libSystem
      # _write import. User-source extern puts / TLS / dlopen-dlsym cases are
      # blocked on native FFI/TLS lowering (Phase 18) and are not asserted here.
      - name: Execute Adesh-source Mach-O programs (Phase 13 link-and-run)
        if: startsWith(matrix.os, 'macos')
        run: cargo test --test native_phase13_macho_exec_test -- --nocapture --test-threads=1

      # Phase 16 host dyld gate: TLV counter + dlopen/dlsym of a produced
      # dylib (linker API objects), with codesign --verify on exe and dylib.
      - name: Execute Phase 16 Mach-O dyld suite (TLV + dlopen)
        if: startsWith(matrix.os, 'macos')
        run: cargo test --test native_phase16_macho_exec_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  foreign-linker-execution:
    name: AArch64 + RISC-V native execution (QEMU)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # A missing emulator or assembler must fail CI, not turn into a skip.
      ADESH_REQUIRE_FOREIGN_EXEC: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: foreign-linker-execution
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Install AArch64 + RISC-V cross toolchains, libc, and Linux user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            qemu-user

      - name: Execute linked AArch64 ELF startup under QEMU
        run: cargo test -p adesh-linker --test phase13_aarch64_exec_test -- --nocapture

      - name: Execute generated FP and vector spills under QEMU
        run: cargo test -p adesh-codegen --test aarch64_scalar_fp_exec --test aarch64_stack_exec --test x86_vector_spill_exec -- --nocapture

      - name: Build and stage the AArch64 runtime archive
        run: bash scripts/build-runtime-archives.sh --profile debug --targets aarch64-unknown-linux-gnu

      - name: Execute Adesh-source AArch64 programs under QEMU
        run: cargo test --test native_phase13_aarch64_exec_test -- --nocapture --test-threads=1

      # Phase 18: source-level `extern "C" puts` on AArch64 under qemu-user.
      - name: Phase 18 source extern C (AArch64 qemu puts)
        env:
          ADESH_REQUIRE_FOREIGN_EXEC: "1"
        run: cargo test --test native_phase18_source_extern_c_test -- --nocapture --test-threads=1 phase18_puts_executes_via_libc_on_linux_aarch64_qemu

      # Phase 14: full AArch64 language-subset conformance corpus under QEMU
      # (arithmetic/branching/loops/functions/arrays + x86-64 differential).
      # Same archive + toolchain staging as the Phase 13 AArch64 step above.
      - name: Execute AArch64 Phase 14 conformance under QEMU
        run: cargo test --test native_phase14_aarch64_conformance_test -- --nocapture --test-threads=1

      - name: Build and stage the RISC-V runtime archive
        run: bash scripts/build-runtime-archives.sh --profile debug --targets riscv64gc-unknown-linux-gnu

      # Hello-world and a bare integer return execute; stack-slot programs are
      # pinned as loud Phase 15 refusals inside the suite. ADESH_REQUIRE_FOREIGN_EXEC
      # turns a missing riscv64 emulator/loader/archive into a failure, not a skip.
      - name: Execute Adesh-source RISC-V programs under QEMU
        run: cargo test --test native_phase13_riscv64_exec_test -- --nocapture --test-threads=1

      # Phase 15: full RISC-V 64 language-subset conformance corpus under QEMU
      # (same fixtures as Phase 14 + x86-64 differential). Reuses the RISC-V
      # archive staged for the Phase 13 step above.
      - name: Execute RISC-V Phase 15 conformance under QEMU
        run: cargo test --test native_phase15_riscv64_conformance_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        run: sccache --show-stats

  # Phase 13 item 6: a dedicated musl job. The TLS suite normally auto-detects
  # the host libc and picks glibc on an Ubuntu runner, so musl was only ever
  # exercised on a developer WSL machine. ADESH_TLS_TEST_MUSL=1 forces the musl
  # triple; the linker then emits PT_INTERP=/lib/ld-musl-x86_64.so.1 and the
  # kernel runs the dynamic initial-exec binary against the REAL musl loader
  # (which must process PT_TLS and apply the TPOFF64 GOT relocation). The musl
  # package supplies that loader; the guard + override assert make a missing
  # loader a failure, never a silent glibc fallback. Tier stays Tier 2 until this
  # job is dispatched and green.
  # Dispatch-only: not part of the PR light gate.
  low-width-execution:
    name: Low-width targets (i686, 8086, AVR, DSP56000)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # A missing emulator, assembler, or DOS runner must fail CI, not turn into a skip.
      ADESH_REQUIRE_FOREIGN_EXEC: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: low-width-execution
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      # i686: gcc-i686-linux-gnu (i686-linux-gnu-gcc) builds the GCC interop fixtures and
      # the runtime C sources; it pulls in the 32-bit cross libc and conflicts with
      # gcc-multilib, so do not install that. qemu-user executes the binaries.
      # AVR: gcc-avr/avr-libc for the reference build, simavr for execution.
      # 8086: dosbox-x executes the MZ EXE under DOS.
      - name: Install i686, AVR, and DOS emulators and toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-i686-linux-gnu qemu-user \
            gcc-avr avr-libc simavr \
            dosbox-x

      - name: Build and stage the i686 runtime archive
        run: bash scripts/build-runtime-archives.sh --profile debug --targets i686-unknown-linux-gnu

      - name: Execute low-width conformance and differential suites
        run: cargo test --no-fail-fast --test low_width_conformance_test --test low_width_differential_test -- --nocapture --test-threads=1

      - name: Execute i686 source programs under qemu-i386 and GCC interop
        run: cargo test --no-fail-fast --test native_phase22_i686_exec_test --test i686_gcc_interop_test -- --nocapture --test-threads=1

      - name: Execute AVR programs under simavr
        run: cargo test --no-fail-fast --test avr_simavr_exec_test -- --nocapture --test-threads=1

      - name: Execute 8086 DOS programs under DOSBox-X
        run: cargo test --no-fail-fast --test i8086_dos_exec_test -- --nocapture --test-threads=1

      - name: Check tier table and no-silent-fallback gates
        run: |
          cargo test --no-fail-fast -p adesh-linker --test phase11_target_tiers_test --test phase11_x86_handler_refusal_test
          cargo test --no-fail-fast -p adesh-codegen --test low_width_no_silent_fallback_test
          cargo test --no-fail-fast -p adesh-codegen --lib targets::i686

      # DSP56000 has no emulator in this repository: this step checks the .LOD build only.
      - name: Build DSP56000 programs to Motorola S-record LOD
        run: cargo test --no-fail-fast --test dsp56000_codegen_lod_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  musl-execution:
    name: musl TLS execution (dedicated)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ADESH_TLS_TEST_MUSL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: musl-execution
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Install musl libc and loader
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-tools
          test -x /lib/ld-musl-x86_64.so.1

      - name: Run the TLS suite against the real musl loader
        run: cargo test --test native_phase8_tls_ehframe_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        run: sccache --show-stats

  checks:
    name: Checks (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Job-scoped sccache only (never workflow-level): a workflow-level
    # RUSTC_WRAPPER used to reach `runtime-archives` / `cross-link` before
    # sccache was installed and every cargo died with ENOENT.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: ci-${{ matrix.os }}
          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test library
        run: cargo test --lib

      - name: Build adesh binary and runtime library
        run: |
          cargo build --lib --bin adesh
          cargo build -p adesh-runtime

      # Linux: the full integration set, including the suites that link and
      # EXECUTE real ELF binaries against the host loader (glibc on the
      # runner): phase 3 static ELFs, phase 8 dynamic linking (real ld.so),
      # and the phase 8 TLS suite (static local-exec via arch_prctl; dynamic
      # initial-exec with a TPOFF64 GOT slot resolved by ld.so at startup).
      # Mach-O structural conformance (macho_dyld_binding_test +
      # macho_phase16_hardening_test, in the adesh-linker crate) runs here
      # too via `cargo test --tests`; actual Mach-O execution and codesign
      # verification have a separate desktop-execution matrix above.
      - name: Test integration suites (Linux, ELF execution)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --tests
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # Phase 11 (safety & truth gate). These three suites are the release
      # gate for the "no silent fallback" and "tiers report verification"
      # rules, so they run by name on every host rather than relying on the
      # umbrella `cargo test --tests` above: the codegen suite proves both
      # backends refuse an unencodable instruction instead of emitting a NOP
      # or a placeholder register, and the two linker suites prove the tier
      # labels match what CI actually verifies and that an RV32 link cannot
      # be handed the RV64 entry stub.
      - name: Test Phase 11 loudness and tier suites
        run: |
          cargo test --test native_phase11_codegen_loudness_test
          cargo test -p adesh-linker --test phase11_target_tiers_test
          cargo test -p adesh-linker --test phase11_riscv32_entry_stub_test

      # RISC-V symbol materialization, checked on the linked image rather than on
      # an object: the AUIPC/ADDI immediates are read back out of the executable
      # and the address the hardware would compute is compared to the symbol's
      # final VA. It needs no runtime archive and no emulator — the linker
      # synthesizes `_start` for the bare-metal triple — so it runs on every host.
      # The suite includes an A/B that links with the wrong LO12 addend and asserts
      # the image is 4 bytes off, so a green run cannot mean "the check went away".
      - name: Test RISC-V PC-relative symbol pair on linked images
        run: cargo test -p adesh-linker --test riscv64_pcrel_symbol_pair_test

      - name: Verify GLIBC compatibility gate on built binary (GLIBC 2.35)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 scripts/ci/check_glibc_compatibility.py 2.35 target/debug/adesh target/debug/libadesh_runtime.a

      # WASM: link real clang objects, including multi-object links and
      # indirect calls through the linker-defined function table, and EXECUTE
      # the modules on two engines. The adesh-linker suites are not covered by
      # the root-level `cargo test --tests` above, so they run by name here. Node
      # (V8) is preinstalled on the runner; the wasmtime run uses the workspace's
      # own wasmtime 36 dependency (Cranelift) and supplies the
      # `wasi_snapshot_preview1.fd_write` host itself, because wasmtime 33+
      # dropped WASI preview1 and no runner-installed CLI would provide it. The
      # compiler suite builds `--target wasm32-unknown-wasi` through the real
      # CLI and asserts the import surface and stdout under the same host.
      - name: Test WASM linker suites (Node + wasmtime execution)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test -p adesh-linker --test wasm_object_reader_test
          cargo test -p adesh-linker --test wasm_link_info_test
          cargo test -p adesh-linker --test wasm_unlinkable_input_test
          cargo test -p adesh-linker --test wasm_writer_test
          cargo test -p adesh-linker --test wasm_relocations_test
          cargo test -p adesh-linker --test wasm_hello_world_test
          cargo test -p adesh-linker --test wasm_cross_object_test
          cargo test -p adesh-linker --test wasm_pure_module_test
          cargo test -p adesh-linker --test wasm_table_test
          cargo test --test wasm_wasmtime_execution_test
          cargo test --test wasm_wasi_compiler_test
          cargo test -p adesh-codegen --test wasm_standalone_exec
          cargo test --test wasm_standalone_source_test
          cargo test --test wasm_syntax_regressions

      # macOS: the full integration set. Native JIT tests compile out on
      # Apple Silicon because Cranelift PLT support is x86-64-only; AOT
      # coverage remains enabled and exercises the target Mach-O runtime
      # archive. Windows PE e2e suites are target-gated and Linux ELF
      # execution suites skip loudly on this host.
      - name: Test integration suites (macOS, Mach-O conformance)
        if: matrix.os == 'macos-latest'
        run: |
          cargo test -p adesh-linker --test macho_dyld_binding_test --test macho_phase16_hardening_test
          cargo test --tests

      # Hang/crash diagnostics for the macOS AOT print regressions live in
      # .github/workflows/macos-aot-debug.yml, which runs on demand.

      # Windows: the Linux ELF execution suites run through WSL when the
      # runner provides it (GitHub windows-* images ship WSL/Ubuntu with
      # glibc); they SKIP loudly when no WSL distro is present instead of
      # failing the job. Static local-exec, dynamic initial-exec against a
      # real ld.so, and the phase 3 freestanding ELFs are all covered here.
      - name: Test Linux ELF execution suites via WSL (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # The native x86-64 e2e tests that link AND execute a produced Windows PE
      # are gated with `#[cfg(all(target_os = "windows", target_arch = "x86_64"))]`
      # at the test level, so the ubuntu-only `cargo test --tests` step above
      # compiles them out instead of attempting to run Windows PEs on Linux.
      # Portable structure/runtime suites (phase 7 target emission, phase 9/10,
      # and the non-execution tests inside phase 4-8 files) still run on
      # ubuntu. The Phase 3 Linux execution suite
      # (tests/native_phase3_linux_e2e_test.rs) is deliberately NOT
      # Windows-gated: on ubuntu it links and executes real static ELF
      # binaries natively and asserts their exit codes. Every Windows PE e2e
      # suite is also run individually on Windows below to keep the native
      # pipeline covered. The semantics suite executes linked binaries
      # that import `aot_*` symbols, so the runtime staticlib must be built
      # first.
      - name: Test PE DLL loading, initialization, and rebasing (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test -p adesh-linker --test phase13_pe_dll_test

      - name: Test native x86-64 e2e suites (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p adesh-runtime
          cargo test --test native_x86_64_e2e_test
          cargo test --test native_parallel_move_e2e_test
          cargo test --test native_phase2_lowering_e2e_test
          cargo test --test native_phase2_abi_atomic_test
          cargo test --test native_phase2_abi_c_interop_test
          cargo test --test native_phase2_abi_closure_test
          cargo test --test native_phase2_abi_enum_test
          cargo test --test native_phase2_abi_struct_by_value_test
          cargo test --test native_phase2_abi_tls_test
          cargo test --test native_phase18_source_extern_c_test
          cargo test --test native_phase18_source_tls_test
          cargo test --test native_phase2_conformance_test
          cargo test --test native_phase3_fp_e2e_test
          cargo test --test native_phase4_lto_driver_test
          cargo test --test native_phase4_pgo_e2e_test
          cargo test --test native_phase4_regalloc_e2e_test
          cargo test --test native_phase5_optimization_e2e_test
          cargo test --test native_phase6_compiler_e2e_test
          cargo test --test native_phase6_lto_e2e_test
          cargo test --test native_phase6_abi_e2e_test
          cargo test --test native_phase6_linker_e2e_test
          cargo test --test native_phase7_simd_e2e_test
          cargo test --test native_phase7_pgo_e2e_test
          cargo test --test native_phase7_aarch64_e2e_test
          cargo test --test native_phase7_riscv64_e2e_test
          cargo test --test native_phase7_atomic_e2e_test
          cargo test --test native_phase7_cross_target_test
          cargo test --test native_phase8_abi_e2e_test
          cargo test --test native_phase8_atomic_e2e_test
          cargo test --test native_phase8_binary_size_test
          cargo test --test native_output_console_test
          cargo test --test native_phase8_cross_compile_test
          cargo test --test native_phase8_debug_e2e_test
          cargo test --test native_phase8_determinism_test
          cargo test --test native_phase8_dynamic_link_test
          cargo test --test native_phase8_ffi_e2e_test
          cargo test --test native_phase8_fuzz_smoke_test
          cargo test --test native_phase8_jit_native_conformance_test
          cargo test --test native_phase8_lto_e2e_test
          cargo test --test native_phase8_pgo_e2e_test
          cargo test --test native_phase8_pic_e2e_test
          cargo test --test native_phase8_runtime_e2e_test
          cargo test --test native_phase8_simd_e2e_test
          cargo test --test native_phase8_unwind_e2e_test
          cargo test --test native_semantics_e2e_test
          cargo test --test native_stack_canary_e2e_test

      - name: Benchmark native pipeline (debug profile)
        if: matrix.os == 'windows-latest'
        run: cargo bench -p adeshlang --profile dev --bench native_pipeline -- --sample-size 10 --warm-up-time 0.1 --measurement-time 0.2 --nresamples 100

      - name: Upload native pipeline benchmark report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: native-pipeline-benchmarks-${{ github.run_number }}
          path: target/criterion
          if-no-files-found: warn

      - name: Display sccache stats
        shell: bash
        run: sccache --show-stats
        if: always()

  # Phase 12 item 3: every advertised native target must have a runtime archive
  # that a cross link can resolve, and nothing may claim a target is buildable
  # from CI because the host's archive happened to be on disk. `adesh build
  # --target` refuses a host archive for a foreign triple
  # (src/backends/aot/cranelift_impl/linking.rs), so this job is what produces
  # the archives and proves each one builds.
  #
  # Two deliberate deviations from the phase text:
  #   * The Apple archives are built on a macOS runner, not cross-built from
  #     Ubuntu. crates/adesh-runtime/src/native_output.c includes <unistd.h> and
  #     the runtime's build.rs runs `cc` for the target, so an *-apple-darwin
  #     archive needs the macOS SDK, which an Ubuntu runner does not have.
  #   * The profile is debug. The archives here verify that a target builds and
  #     stage at the path resolution searches; release archives for distribution
  #     are produced by scripts/release/package_unix.sh and the Windows release
  #     script, not by this job.
  runtime-archives:
    name: Runtime archives (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            # The runner's own triple is included so the artifact set covers
            # every Tier 1/2 Linux target this job can build.
            targets: "i686-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu"
          - name: darwin
            os: macos-latest
            # macos-latest is arm64, so aarch64-apple-darwin is the host triple
            # and x86_64-apple-darwin is a same-SDK cross build; both need only
            # the rust-std component.
            targets: "aarch64-apple-darwin x86_64-apple-darwin"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: runtime-archives-${{ matrix.name }}
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Install cross C toolchains (Linux targets)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            gcc-multilib libc6-dev-i386

      - name: Add Rust targets
        shell: bash
        run: rustup target add ${{ matrix.targets }}

      - name: Build and stage the runtime archives
        shell: bash
        run: bash scripts/build-runtime-archives.sh --profile debug --targets "${{ matrix.targets }}"

      # The archive is only useful if the linker resolves it by triple, so each
      # one is collected from the shape a link searches —
      # `target/<triple>/<profile>/<archive name>` — and copied to a staging
      # directory that mirrors an install's `lib/<triple>/` layout. `find` is
      # BSD on the macOS runner, so sizes come from `wc`, not `-printf`.
      - name: Collect archives for upload
        shell: bash
        run: |
          rm -rf runtime-archives
          mkdir -p runtime-archives
          for archived in $(find target -mindepth 3 -maxdepth 3 -type f \
              \( -name 'libadesh_runtime.a' -o -name 'adesh_runtime.lib' \) \
              -path '*/debug/*' | sort); do
            triple=$(echo "$archived" | cut -d/ -f2)
            mkdir -p "runtime-archives/$triple"
            cp "$archived" "runtime-archives/$triple/"
            printf '%s  %s bytes  -> runtime-archives/%s\n' \
              "$archived" "$(wc -c <"$archived" | tr -d ' ')" "$triple"
          done

      - name: Upload runtime archives
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: runtime-archives-${{ matrix.name }}-debug-${{ github.run_number }}
          path: runtime-archives
          if-no-files-found: error
          retention-days: 30

      - name: Display sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  # Phase 12 item 4: the archives above only matter if a link consumes them.
  # `tests/native_phase12_cross_link_test.rs` reads the produced image — ELF/PE/
  # Mach-O header and the `aot_*` symbol table — rather than trusting an exit code,
  # so a build that fell back to the wrong archive fails here even when it reports
  # success.
  #
  # The gate test and the two refusal tests run on any checkout and need nothing.
  # The three archive-dependent tests skip loudly unless a per-triple archive is
  # staged, and staging it is what this job does: it downloads the artifact the job
  # above uploads into `target/<triple>/debug/`, the first path the resolver
  # searches. Without this job, Phase 12's exit criterion ("a cross build links for
  # each advertised target") is never exercised.
  #
  # All three OSes run it on purpose. A Windows or macOS runner is where a Linux
  # image gets linked with no Linux kernel in sight — the claim the phase makes — and
  # a Linux runner is where a Mach-O image is linked without a macOS host.
  cross-link:
    name: Cross link (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    needs: runtime-archives
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1d7521cd68a3b4e73bfaf7b2838ef7db23c8bde4 # v0.0.8

      - name: Enable sccache for cargo
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          shared-key: cross-link-${{ matrix.name }}
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Download the runtime archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: runtime-archives-*-debug-${{ github.run_number }}
          merge-multiple: true
          path: runtime-archives

      # Stage each archive at `target/<triple>/<profile>/`, the shape the resolver's
      # target-scoped search expects, and fail loudly if the artifact arrived without
      # an archive in it. A silent `cp` of an empty directory would hand the suite the
      # same "nothing staged" state a fresh checkout has, and the skips would then read
      # as CI doing its job.
      - name: Stage archives at target/<triple>/debug
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d runtime-archives ]; then
            echo "::error::no runtime-archives artifact was downloaded; the cross-link suite" \
                 "would skip every archive-dependent test and prove nothing"
            exit 1
          fi
          count=0
          for dir in runtime-archives/*/; do
            triple=$(basename "$dir")
            archive=$(find "$dir" -maxdepth 1 -type f \
              \( -name 'libadesh_runtime.a' -o -name 'adesh_runtime.lib' \) | head -1)
            if [ -z "$archive" ]; then
              echo "::error::runtime-archives/$triple contains no runtime archive"
              exit 1
            fi
            mkdir -p "target/$triple/debug"
            cp "$archive" "target/$triple/debug/"
            printf 'staged %s (%s bytes) -> target/%s/debug/\n' \
              "$archive" "$(wc -c <"$archive" | tr -d ' ')" "$triple"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::runtime-archives/ contains no per-triple directory"
            exit 1
          fi
          echo "staged $count target archive(s)"

      # The suite's control test links and executes a host image, so the host
      # archive has to exist too. On the Linux and macOS runners the artifact set
      # already contains it; the script reports it as skipped. On Windows the host
      # triple is not in the cross matrix at all, so this is what builds it.
      - name: Stage the host runtime archive
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          bash scripts/build-runtime-archives.sh --profile debug --targets "$host"

      - name: Link for each advertised target and verify the images
        shell: bash
        run: cargo test --test native_phase12_cross_link_test -- --nocapture --test-threads=1

      - name: Display sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats


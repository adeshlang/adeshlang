name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'als/**'
      - 'editor/**'
      - 'crates/**'
      - 'mobile/bridge/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'build.rs'
      - '**.rs'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'als/**'
      - 'editor/**'
      - 'crates/**'
      - 'mobile/bridge/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'build.rs'
      - '**.rs'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test library
        run: cargo test --lib

      - name: Build adesh binary and runtime library
        run: |
          cargo build --lib --bin adesh
          cargo build -p adesh-runtime

      # Linux: the full integration set, including the suites that link and
      # EXECUTE real ELF binaries against the host loader (glibc on the
      # runner): phase 3 static ELFs, phase 8 dynamic linking (real ld.so),
      # and the phase 8 TLS suite (static local-exec via arch_prctl; dynamic
      # initial-exec with a TPOFF64 GOT slot resolved by ld.so at startup).
      # Mach-O structural conformance (macho_dyld_binding_test, in the
      # adesh-linker crate) runs here too; Mach-O EXECUTION verification
      # does not exist yet and is tracked as pending in TARGET_MATRIX.md.
      - name: Test integration suites (Linux, ELF execution)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --tests
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # macOS: the full integration set. Native JIT tests compile out on
      # Apple Silicon because Cranelift PLT support is x86-64-only; AOT
      # coverage remains enabled and exercises the target Mach-O runtime
      # archive. Windows PE e2e suites are target-gated and Linux ELF
      # execution suites skip loudly on this host.
      - name: Test integration suites (macOS, Mach-O conformance)
        if: matrix.os == 'macos-latest'
        run: |
          cargo test -p adesh-linker --test macho_dyld_binding_test
          cargo test --tests

      # Temporary: dump everything needed to diagnose AOT executable crashes
      # on Apple Silicon (signal, faulting instruction, dyld fixups, signature).
      - name: Collect macOS AOT crash diagnostics
        if: failure() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -u

          echo "== host =="
          uname -a || true
          echo "pagesize: $(getconf PAGESIZE 2>/dev/null || echo unknown)"

          tmp="${TMPDIR:-/tmp}"
          echo "== temp dir: $tmp =="
          ls -la "$tmp" | grep -i adesh || true

          while IFS= read -r -d '' bin; do
            echo "================ BINARY: $bin ================"
            file "$bin" || true
            echo "---- codesign ----"
            codesign -dvvv "$bin" 2>&1 | head -n 40 || true
            echo "---- otool -hv ----"
            otool -hv "$bin" || true
            echo "---- otool -l ----"
            otool -l "$bin" | sed -n '1,200p' || true
            echo "---- dyld_info -rebase -bind ----"
            xcrun dyld_info -rebase -bind "$bin" 2>&1 | head -n 160 || true
            echo "---- lldb ----"
            xcrun lldb -b \
              -o "settings set target.process.stop-on-sharedlibrary-events false" \
              -o "run" \
              -o "bt all" \
              -o "register read pc sp lr x0 x1 x16 x17" \
              -o "disassemble -s \$pc -c 8" \
              -o "thread list" \
              -o "quit" \
              -- "$bin" 2>&1 | tail -n 200 || true
          done < <(find "$tmp" -maxdepth 1 -name 'adesh_day1_aot_*' -type f -print0 2>/dev/null)

          echo "== crash reports =="
          reports_dir="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports_dir" ]; then
            ls -t "$reports_dir"/*.ips 2>/dev/null | head -n 2 | while IFS= read -r rep; do
              echo "------ $rep ------"
              head -c 40000 "$rep" || true
              echo
            done
          else
            echo "no crash report directory"
          fi

      # Windows: the Linux ELF execution suites run through WSL when the
      # runner provides it (GitHub windows-* images ship WSL/Ubuntu with
      # glibc); they SKIP loudly when no WSL distro is present instead of
      # failing the job. Static local-exec, dynamic initial-exec against a
      # real ld.so, and the phase 3 freestanding ELFs are all covered here.
      - name: Test Linux ELF execution suites via WSL (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # The native x86-64 e2e tests that link AND execute a produced Windows PE
      # are gated with `#[cfg(all(target_os = "windows", target_arch = "x86_64"))]`
      # at the test level, so the ubuntu-only `cargo test --tests` step above
      # compiles them out instead of attempting to run Windows PEs on Linux.
      # Portable structure/runtime suites (phase 7 target emission, phase 9/10,
      # and the non-execution tests inside phase 4-8 files) still run on
      # ubuntu. The Phase 3 Linux execution suite
      # (tests/native_phase3_linux_e2e_test.rs) is deliberately NOT
      # Windows-gated: on ubuntu it links and executes real static ELF
      # binaries natively and asserts their exit codes. Every Windows PE e2e
      # suite is also run individually on Windows below to keep the native
      # pipeline covered. The semantics suite executes linked binaries
      # that import `aot_*` symbols, so the runtime staticlib must be built
      # first.
      - name: Test native x86-64 e2e suites (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p adesh-runtime
          cargo test --test native_x86_64_e2e_test
          cargo test --test native_parallel_move_e2e_test
          cargo test --test native_phase2_lowering_e2e_test
          cargo test --test native_phase2_abi_atomic_test
          cargo test --test native_phase2_abi_c_interop_test
          cargo test --test native_phase2_abi_closure_test
          cargo test --test native_phase2_abi_enum_test
          cargo test --test native_phase2_abi_struct_by_value_test
          cargo test --test native_phase2_abi_tls_test
          cargo test --test native_phase2_conformance_test
          cargo test --test native_phase3_fp_e2e_test
          cargo test --test native_phase4_lto_driver_test
          cargo test --test native_phase4_pgo_e2e_test
          cargo test --test native_phase4_regalloc_e2e_test
          cargo test --test native_phase5_optimization_e2e_test
          cargo test --test native_phase6_compiler_e2e_test
          cargo test --test native_phase6_lto_e2e_test
          cargo test --test native_phase6_abi_e2e_test
          cargo test --test native_phase6_linker_e2e_test
          cargo test --test native_phase7_simd_e2e_test
          cargo test --test native_phase7_pgo_e2e_test
          cargo test --test native_phase7_aarch64_e2e_test
          cargo test --test native_phase7_riscv64_e2e_test
          cargo test --test native_phase7_atomic_e2e_test
          cargo test --test native_phase7_cross_target_test
          cargo test --test native_phase8_abi_e2e_test
          cargo test --test native_phase8_atomic_e2e_test
          cargo test --test native_phase8_binary_size_test
          cargo test --test native_output_console_test
          cargo test --test native_phase8_cross_compile_test
          cargo test --test native_phase8_debug_e2e_test
          cargo test --test native_phase8_determinism_test
          cargo test --test native_phase8_dynamic_link_test
          cargo test --test native_phase8_ffi_e2e_test
          cargo test --test native_phase8_fuzz_smoke_test
          cargo test --test native_phase8_lto_e2e_test
          cargo test --test native_phase8_pgo_e2e_test
          cargo test --test native_phase8_pic_e2e_test
          cargo test --test native_phase8_runtime_e2e_test
          cargo test --test native_phase8_simd_e2e_test
          cargo test --test native_phase8_unwind_e2e_test
          cargo test --test native_semantics_e2e_test
          cargo test --test native_stack_canary_e2e_test

      - name: Benchmark native pipeline (debug profile)
        if: matrix.os == 'windows-latest'
        run: cargo bench -p adeshlang --profile dev --bench native_pipeline -- --sample-size 10 --warm-up-time 0.1 --measurement-time 0.2 --nresamples 100

      - name: Upload native pipeline benchmark report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: native-pipeline-benchmarks-${{ github.run_number }}
          path: target/criterion
          if-no-files-found: warn

      - name: Display sccache stats
        shell: bash
        run: sccache --show-stats
        if: always()



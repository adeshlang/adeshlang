name: CI

# Manual only: a full matrix run is expensive, so it is started on demand.
# Tagged/release builds are covered by the separate release workflow.
on:
  workflow_dispatch:

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test library
        run: cargo test --lib

      - name: Build adesh binary and runtime library
        run: |
          cargo build --lib --bin adesh
          cargo build -p adesh-runtime

      # Linux: the full integration set, including the suites that link and
      # EXECUTE real ELF binaries against the host loader (glibc on the
      # runner): phase 3 static ELFs, phase 8 dynamic linking (real ld.so),
      # and the phase 8 TLS suite (static local-exec via arch_prctl; dynamic
      # initial-exec with a TPOFF64 GOT slot resolved by ld.so at startup).
      # Mach-O structural conformance (macho_dyld_binding_test, in the
      # adesh-linker crate) runs here too; Mach-O EXECUTION verification
      # does not exist yet and is tracked as pending in TARGET_MATRIX.md.
      - name: Test integration suites (Linux, ELF execution)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --tests
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # Phase 11 (safety & truth gate). These three suites are the release
      # gate for the "no silent fallback" and "tiers report verification"
      # rules, so they run by name on every host rather than relying on the
      # umbrella `cargo test --tests` above: the codegen suite proves both
      # backends refuse an unencodable instruction instead of emitting a NOP
      # or a placeholder register, and the two linker suites prove the tier
      # labels match what CI actually verifies and that an RV32 link cannot
      # be handed the RV64 entry stub.
      - name: Test Phase 11 loudness and tier suites
        run: |
          cargo test --test native_phase11_codegen_loudness_test
          cargo test -p adesh-linker --test phase11_target_tiers_test
          cargo test -p adesh-linker --test phase11_riscv32_entry_stub_test

      - name: Verify GLIBC compatibility gate on built binary (GLIBC 2.35)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 scripts/ci/check_glibc_compatibility.py 2.35 target/debug/adesh target/debug/libadesh_runtime.a

      # WASM: link real clang objects, including multi-object links and
      # indirect calls through the linker-defined function table, and EXECUTE
      # the modules on two engines. The adesh-linker suites are not covered by
      # the root-level `cargo test --tests` above, so they run by name here. Node
      # (V8) is preinstalled on the runner; the wasmtime run uses the workspace's
      # own wasmtime 36 dependency (Cranelift) and supplies the
      # `wasi_snapshot_preview1.fd_write` host itself, because wasmtime 33+
      # dropped WASI preview1 and no runner-installed CLI would provide it. The
      # compiler suite builds `--target wasm32-unknown-wasi` through the real
      # CLI and asserts the import surface and stdout under the same host.
      - name: Test WASM linker suites (Node + wasmtime execution)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test -p adesh-linker --test wasm_object_reader_test
          cargo test -p adesh-linker --test wasm_link_info_test
          cargo test -p adesh-linker --test wasm_unlinkable_input_test
          cargo test -p adesh-linker --test wasm_writer_test
          cargo test -p adesh-linker --test wasm_relocations_test
          cargo test -p adesh-linker --test wasm_hello_world_test
          cargo test -p adesh-linker --test wasm_cross_object_test
          cargo test -p adesh-linker --test wasm_pure_module_test
          cargo test -p adesh-linker --test wasm_table_test
          cargo test --test wasm_wasmtime_execution_test
          cargo test --test wasm_wasi_compiler_test

      # macOS: the full integration set. Native JIT tests compile out on
      # Apple Silicon because Cranelift PLT support is x86-64-only; AOT
      # coverage remains enabled and exercises the target Mach-O runtime
      # archive. Windows PE e2e suites are target-gated and Linux ELF
      # execution suites skip loudly on this host.
      - name: Test integration suites (macOS, Mach-O conformance)
        if: matrix.os == 'macos-latest'
        run: |
          cargo test -p adesh-linker --test macho_dyld_binding_test
          cargo test --tests

      # Hang/crash diagnostics for the macOS AOT print regressions live in
      # .github/workflows/macos-aot-debug.yml, which runs on demand.

      # Windows: the Linux ELF execution suites run through WSL when the
      # runner provides it (GitHub windows-* images ship WSL/Ubuntu with
      # glibc); they SKIP loudly when no WSL distro is present instead of
      # failing the job. Static local-exec, dynamic initial-exec against a
      # real ld.so, and the phase 3 freestanding ELFs are all covered here.
      - name: Test Linux ELF execution suites via WSL (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo test --test native_phase3_linux_e2e_test
          cargo test --test native_phase8_dynamic_elf_test
          cargo test --test native_phase8_tls_ehframe_test

      # The native x86-64 e2e tests that link AND execute a produced Windows PE
      # are gated with `#[cfg(all(target_os = "windows", target_arch = "x86_64"))]`
      # at the test level, so the ubuntu-only `cargo test --tests` step above
      # compiles them out instead of attempting to run Windows PEs on Linux.
      # Portable structure/runtime suites (phase 7 target emission, phase 9/10,
      # and the non-execution tests inside phase 4-8 files) still run on
      # ubuntu. The Phase 3 Linux execution suite
      # (tests/native_phase3_linux_e2e_test.rs) is deliberately NOT
      # Windows-gated: on ubuntu it links and executes real static ELF
      # binaries natively and asserts their exit codes. Every Windows PE e2e
      # suite is also run individually on Windows below to keep the native
      # pipeline covered. The semantics suite executes linked binaries
      # that import `aot_*` symbols, so the runtime staticlib must be built
      # first.
      - name: Test native x86-64 e2e suites (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build -p adesh-runtime
          cargo test --test native_x86_64_e2e_test
          cargo test --test native_parallel_move_e2e_test
          cargo test --test native_phase2_lowering_e2e_test
          cargo test --test native_phase2_abi_atomic_test
          cargo test --test native_phase2_abi_c_interop_test
          cargo test --test native_phase2_abi_closure_test
          cargo test --test native_phase2_abi_enum_test
          cargo test --test native_phase2_abi_struct_by_value_test
          cargo test --test native_phase2_abi_tls_test
          cargo test --test native_phase2_conformance_test
          cargo test --test native_phase3_fp_e2e_test
          cargo test --test native_phase4_lto_driver_test
          cargo test --test native_phase4_pgo_e2e_test
          cargo test --test native_phase4_regalloc_e2e_test
          cargo test --test native_phase5_optimization_e2e_test
          cargo test --test native_phase6_compiler_e2e_test
          cargo test --test native_phase6_lto_e2e_test
          cargo test --test native_phase6_abi_e2e_test
          cargo test --test native_phase6_linker_e2e_test
          cargo test --test native_phase7_simd_e2e_test
          cargo test --test native_phase7_pgo_e2e_test
          cargo test --test native_phase7_aarch64_e2e_test
          cargo test --test native_phase7_riscv64_e2e_test
          cargo test --test native_phase7_atomic_e2e_test
          cargo test --test native_phase7_cross_target_test
          cargo test --test native_phase8_abi_e2e_test
          cargo test --test native_phase8_atomic_e2e_test
          cargo test --test native_phase8_binary_size_test
          cargo test --test native_output_console_test
          cargo test --test native_phase8_cross_compile_test
          cargo test --test native_phase8_debug_e2e_test
          cargo test --test native_phase8_determinism_test
          cargo test --test native_phase8_dynamic_link_test
          cargo test --test native_phase8_ffi_e2e_test
          cargo test --test native_phase8_fuzz_smoke_test
          cargo test --test native_phase8_jit_native_conformance_test
          cargo test --test native_phase8_lto_e2e_test
          cargo test --test native_phase8_pgo_e2e_test
          cargo test --test native_phase8_pic_e2e_test
          cargo test --test native_phase8_runtime_e2e_test
          cargo test --test native_phase8_simd_e2e_test
          cargo test --test native_phase8_unwind_e2e_test
          cargo test --test native_semantics_e2e_test
          cargo test --test native_stack_canary_e2e_test

      - name: Benchmark native pipeline (debug profile)
        if: matrix.os == 'windows-latest'
        run: cargo bench -p adeshlang --profile dev --bench native_pipeline -- --sample-size 10 --warm-up-time 0.1 --measurement-time 0.2 --nresamples 100

      - name: Upload native pipeline benchmark report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: native-pipeline-benchmarks-${{ github.run_number }}
          path: target/criterion
          if-no-files-found: warn

      - name: Display sccache stats
        shell: bash
        run: sccache --show-stats
        if: always()

  # Phase 12 item 3: every advertised native target must have a runtime archive
  # that a cross link can resolve, and nothing may claim a target is buildable
  # from CI because the host's archive happened to be on disk. `adesh build
  # --target` refuses a host archive for a foreign triple
  # (src/backends/aot/cranelift_impl/linking.rs), so this job is what produces
  # the archives and proves each one builds.
  #
  # Two deliberate deviations from the phase text:
  #   * The Apple archives are built on a macOS runner, not cross-built from
  #     Ubuntu. crates/adesh-runtime/src/native_output.c includes <unistd.h> and
  #     the runtime's build.rs runs `cc` for the target, so an *-apple-darwin
  #     archive needs the macOS SDK, which an Ubuntu runner does not have.
  #   * The profile is debug. The archives here verify that a target builds and
  #     stage at the path resolution searches; release archives for distribution
  #     are produced by scripts/release/package_unix.sh and the Windows release
  #     script, not by this job.
  runtime-archives:
    name: Runtime archives (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            # The runner's own triple is included so the artifact set covers
            # every Tier 1/2 Linux target this job can build.
            targets: "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu"
          - name: darwin
            os: macos-latest
            # macos-latest is arm64, so aarch64-apple-darwin is the host triple
            # and x86_64-apple-darwin is a same-SDK cross build; both need only
            # the rust-std component.
            targets: "aarch64-apple-darwin x86_64-apple-darwin"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross C toolchains (Linux targets)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Add Rust targets
        shell: bash
        run: rustup target add ${{ matrix.targets }}

      - name: Build and stage the runtime archives
        shell: bash
        run: bash scripts/build-runtime-archives.sh --profile debug --targets "${{ matrix.targets }}"

      # The archive is only useful if the linker resolves it by triple, so each
      # one is collected from the shape a link searches —
      # `target/<triple>/<profile>/<archive name>` — and copied to a staging
      # directory that mirrors an install's `lib/<triple>/` layout. `find` is
      # BSD on the macOS runner, so sizes come from `wc`, not `-printf`.
      - name: Collect archives for upload
        shell: bash
        run: |
          rm -rf runtime-archives
          mkdir -p runtime-archives
          for archived in $(find target -mindepth 3 -maxdepth 3 -type f \
              \( -name 'libadesh_runtime.a' -o -name 'adesh_runtime.lib' \) \
              -path '*/debug/*' | sort); do
            triple=$(echo "$archived" | cut -d/ -f2)
            mkdir -p "runtime-archives/$triple"
            cp "$archived" "runtime-archives/$triple/"
            printf '%s  %s bytes  -> runtime-archives/%s\n' \
              "$archived" "$(wc -c <"$archived" | tr -d ' ')" "$triple"
          done

      - name: Upload runtime archives
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archives-${{ matrix.name }}-debug-${{ github.run_number }}
          path: runtime-archives
          if-no-files-found: error
          retention-days: 30




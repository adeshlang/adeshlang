name: CI

on:
  push:
  pull_request:

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test library
        run: cargo test --lib

      - name: Test integration suites
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --tests

      - name: Check adesh binary
        run: cargo check --bin adesh

# Release process:
#   1. Tag the commit as vX.Y.Z and push the tag.
#   2. The matrix below builds the five supported host platforms and uploads
#      their core archives plus any optional native installer packages.
#   3. The checksum job creates SHA256SUMS.txt, and the release job publishes
#      all assets with generated release notes.
#
# The toolchain is deliberately not built or bundled. Installers download the
# pinned LLVM/MLIR artifacts described by toolchain-manifest.json at install
# time. update-toolchain-manifest.yml refreshes that manifest, and this
# workflow publishes it as the stable toolchain-manifest.json asset.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. v0.3.0)'
        required: false
        default: ''

# Repository migration: origin is currently ajaytainwala-dev/mylang; keep the
# official destination in one overridable workflow-level variable.
env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            kind: windows
            os: windows
            arch: x86_64
          - platform: windows-aarch64
            runner: windows-latest
            kind: windows
            os: windows
            arch: aarch64
          - platform: linux-x86_64
            runner: ubuntu-latest
            kind: unix
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            kind: unix
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-14
            kind: unix
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-13
            kind: unix
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}
          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target
          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Build Windows portable distribution
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/release/build_windows_dist.ps1" -Arch "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows distribution script failed with exit code $LASTEXITCODE."
          }
          $bundledToolchain = Join-Path $env:GITHUB_WORKSPACE "dist\windows-${{ matrix.arch }}\toolchain"
          if (Test-Path -LiteralPath $bundledToolchain) {
            # LLVM is fetched by installers at install time and is never a
            # release payload, even if a runner workspace contains a copy.
            Get-ChildItem -LiteralPath $bundledToolchain -Recurse -File |
              Remove-Item -Force
            Get-ChildItem -LiteralPath $bundledToolchain -Recurse -Directory |
              Sort-Object FullName -Descending |
              Where-Object { -not (Get-ChildItem -LiteralPath $_.FullName -Force) } |
              Remove-Item -Force
            if (-not (Get-ChildItem -LiteralPath $bundledToolchain -Force)) {
              Remove-Item -LiteralPath $bundledToolchain -Force
            }
          }

      - name: Add required Windows distribution files
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $stage = Join-Path $root "dist\windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "std") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "lib") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "config") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "licenses") | Out-Null
          Copy-Item -Path (Join-Path $root "src\stdlib\*.adesh") `
            -Destination (Join-Path $stage "std") -Force
          Copy-Item -Path (Join-Path $root "installer\manifests\toolchain-manifest.json") `
            -Destination (Join-Path $stage "config\toolchain-manifest.json") -Force
          Copy-Item -Path (Join-Path $root "LICENSE") `
            -Destination (Join-Path $stage "licenses\LICENSE.txt") -Force
          $runtimeLib = Join-Path $root "target\release\adeshlang.lib"
          if ("${{ matrix.arch }}" -eq "aarch64") {
            $aarch64Lib = Join-Path $root "target\aarch64-pc-windows-msvc\release\adeshlang.lib"
            if (Test-Path $aarch64Lib) { $runtimeLib = $aarch64Lib }
          }
          if (Test-Path $runtimeLib) {
            Copy-Item -Path $runtimeLib -Destination (Join-Path $stage "lib\adeshlang.lib") -Force
          }

          # build_windows_dist.ps1 creates the portable archive before the
          # common std/config layout is added, so refresh that archive here.
          $version = (Get-Content -LiteralPath (Join-Path $root "Cargo.toml") |
            Where-Object { $_ -match '^version = "(.+)"' } |
            Select-Object -First 1) -replace '^version = "(.+)"', '$1'
          $oldPortable = Get-ChildItem -LiteralPath $dist -Filter "*windows-portable.zip" -File |
            Select-Object -First 1
          if (-not $oldPortable) {
            throw "The Windows portable archive was not created."
          }
          $portable = Join-Path $dist "AdeshLang-$version-${{ matrix.arch }}-windows-portable.zip"
          Remove-Item -LiteralPath $oldPortable.FullName -Force
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath $portable -Force

      - name: Build optional Windows installers
        # The setup EXE and the MSI/bundle are x64-only; ARM64 ships the
        # portable ZIP.
        if: matrix.kind == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $iss = Join-Path $root "installer\windows\installer.iss"

          if (Test-Path -LiteralPath $iss) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) {
              try {
                # The core ZIP must remain shippable if Chocolatey or Inno
                # Setup is temporarily unavailable on the hosted runner.
                & choco install innosetup --version=6.4.3 --yes --no-progress
                if ($LASTEXITCODE -ne 0) {
                  throw "Chocolatey exited with code $LASTEXITCODE."
                }
              } catch {
                Write-Warning "Inno Setup installation skipped: $($_.Exception.Message)"
              }
              $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
              if (-not $iscc) {
                foreach ($candidate in @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe"
                )) {
                  if (Test-Path -LiteralPath $candidate) {
                    $iscc = $candidate
                    break
                  }
                }
              }
            }
            if ($iscc) {
              try {
                & $iscc $iss
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "ISCC failed with exit code $LASTEXITCODE; continuing with core packages."
                }
              } catch {
                Write-Warning "ISCC could not compile the installer: $($_.Exception.Message)"
              }
            } else {
              Write-Warning "ISCC.exe is unavailable; skipping installer/windows/installer.iss."
            }
          } else {
            Write-Warning "installer/windows/installer.iss is absent; skipping Inno Setup."
          }

          $msiScript = Join-Path $root "installer\windows\msi\build-msi.ps1"
          $bundleScript = Join-Path $root "installer\windows\bundle\build-bundle.ps1"
          $wix = $null
          if ((Test-Path -LiteralPath $msiScript) -or (Test-Path -LiteralPath $bundleScript)) {
            if (Get-Command dotnet -ErrorAction SilentlyContinue) {
              try {
                & dotnet tool install --global wix
                if ($LASTEXITCODE -ne 0) {
                  throw "dotnet tool install exited with code $LASTEXITCODE."
                }
              } catch {
                Write-Warning "WiX installation skipped: $($_.Exception.Message)"
              }
              $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
              $wix = (Get-Command wix.exe -ErrorAction SilentlyContinue).Source
              if (-not $wix) {
                $wix = (Get-Command wix -ErrorAction SilentlyContinue).Source
              }
            } else {
              Write-Warning "dotnet is unavailable; cannot install WiX."
            }
            if (-not $wix) {
              Write-Warning "WiX v5 is unavailable; optional MSI/bundle builds will be skipped."
            }
          }

          foreach ($script in @($msiScript, $bundleScript)) {
            if (Test-Path -LiteralPath $script) {
              if ($wix) {
                try {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File $script
                  if ($LASTEXITCODE -ne 0) {
                    Write-Warning "$script failed with exit code $LASTEXITCODE."
                  }
                } catch {
                  Write-Warning "$script could not run: $($_.Exception.Message)"
                }
              } else {
                Write-Warning "Skipping $script because WiX is unavailable."
              }
            }
          }

          # Installer scripts choose their own output directories. Bring their
          # package files into dist so the common artifact upload sees them.
          $dist = Join-Path $root "dist"
          Get-ChildItem -LiteralPath (Join-Path $root "installer\windows") `
            -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName `
                -Destination (Join-Path $dist $_.Name) -Force
            }

      - name: Build and stage Unix distribution
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          chmod +x scripts/release/package_unix.sh
          ./scripts/release/package_unix.sh \
            "$version" "${{ matrix.arch }}" "${{ matrix.os }}" "${{ matrix.target }}"

          stage="$GITHUB_WORKSPACE/dist/AdeshLang-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          archive="$GITHUB_WORKSPACE/dist/AdeshLang-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.xz"
          # Keep the toolchain out of release archives; installers fetch the
          # pinned upstream LLVM artifact using the published manifest.
          if [ -d "$stage/toolchain" ]; then
            find "$stage/toolchain" -type f -delete
            find "$stage/toolchain" -depth -type d -empty -delete
          fi
          mkdir -p "$stage/std" "$stage/config" "$stage/licenses"
          cp src/stdlib/*.adesh "$stage/std/"
          cp installer/manifests/toolchain-manifest.json "$stage/config/toolchain-manifest.json"
          cp LICENSE "$stage/licenses/LICENSE.txt"

          # package_unix.sh owns the build and initial archive; re-pack after
          # adding the release-wide std/config/licenses layout.
          rm -f "$archive"
          tar -C "$GITHUB_WORKSPACE/dist" -cJf "$archive" "$(basename "$stage")"

      - name: Build optional Linux packages
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -u
          if [ -f installer/linux/deb/build-deb.sh ]; then
            if command -v dpkg-deb >/dev/null 2>&1; then
              if ! bash installer/linux/deb/build-deb.sh; then
                echo "::warning::The Debian package script failed; continuing with core archives."
              fi
            else
              echo "::warning::dpkg-deb is unavailable; skipping Debian packaging."
            fi
          else
            echo "::notice::installer/linux/deb/build-deb.sh is absent; skipping Debian packaging."
          fi

          if [ -f installer/linux/rpm/build-rpm.sh ]; then
            if ! command -v rpmbuild >/dev/null 2>&1; then
              if sudo apt-get update && sudo apt-get install -y rpm; then
                echo "Installed rpm tooling."
              else
                echo "::warning::Unable to install rpm tooling; attempting the package script anyway."
              fi
            fi
            if ! bash installer/linux/rpm/build-rpm.sh; then
              echo "::warning::The RPM package script failed; continuing with core archives."
            fi
          else
            echo "::notice::installer/linux/rpm/build-rpm.sh is absent; skipping RPM packaging."
          fi

          mkdir -p dist
          if [ -d installer/linux ]; then
            while IFS= read -r -d '' package; do
              cp -f "$package" dist/
            done < <(find installer/linux -type f \( -name '*.deb' -o -name '*.rpm' \) -print0)
          fi

      - name: Build optional macOS packages
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -u
          if [ -f installer/macos/build-pkg.sh ]; then
            chmod +x installer/macos/build-pkg.sh
            if ! bash installer/macos/build-pkg.sh; then
              echo "::warning::The macOS PKG script failed; continuing with core archives."
            fi
          else
            echo "::notice::installer/macos/build-pkg.sh is absent; skipping PKG packaging."
          fi

          if [ -f installer/macos/build-dmg.sh ]; then
            chmod +x installer/macos/build-dmg.sh
            if ! bash installer/macos/build-dmg.sh; then
              echo "::warning::The macOS DMG script failed; continuing with core archives."
            fi
          else
            echo "::notice::installer/macos/build-dmg.sh is absent; skipping DMG packaging."
          fi

          mkdir -p dist
          if [ -d installer/macos ]; then
            while IFS= read -r -d '' package; do
              cp -f "$package" dist/
            done < <(find installer/macos -type f \( -name '*.pkg' -o -name '*.dmg' \) -print0)
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip
            dist/*.tar.xz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*.dmg
            dist/*.exe
            dist/*.msi

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          # Include the separately published manifest in the checksum set.
          cp installer/manifests/toolchain-manifest.json dist/
          if command -v pwsh >/dev/null 2>&1; then
            # Run the repository helper first, then write the required .txt
            # name and include optional MSI files the helper predates.
            pwsh -NoProfile -File scripts/release/generate_checksums.ps1 -Dist "$PWD/dist"
            rm -f dist/SHA256SUMS
            rm -f dist/SHA256SUMS.txt
            pwsh -NoProfile -Command '
              $dist = (Resolve-Path "dist").Path
              Get-ChildItem -LiteralPath $dist -File |
                Where-Object { $_.Name -notin @("SHA256SUMS", "SHA256SUMS.txt") } |
                Sort-Object Name |
                ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
                } | Set-Content -LiteralPath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
            '
          else
            echo "::warning::pwsh is unavailable; using the runner SHA256 utility."
            (
              cd dist
              : > SHA256SUMS.txt
              while IFS= read -r -d '' file; do
                if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$file" >> SHA256SUMS.txt
                elif command -v sha256 >/dev/null 2>&1; then
                  sha256 -r "$file" >> SHA256SUMS.txt
                else
                  echo "No sha256sum or sha256 utility is available." >&2
                  exit 1
                fi
              done < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | sort -z)
            )
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          if-no-files-found: error
          retention-days: 7
          path: dist/SHA256SUMS.txt

  release:
    name: Publish GitHub release
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Avoid duplicate manifest asset
        shell: bash
        run: rm -f dist/toolchain-manifest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            installer/manifests/toolchain-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ==============================================================================
# AdeshLang Release Workflow
# ==============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v0.3.1)"
        required: true
        type: string

env:
  ADESH_REPO: adeshlang/adeshlang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  ADESH_SKIP_AI_MODEL: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ==============================================================================
# BUILD
# ==============================================================================

jobs:

  build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 6

      matrix:
        include:

          # Windows x86_64
          - platform: windows-x86_64
            runner: windows-latest
            kind: windows
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc

          # Windows ARM64
          - platform: windows-aarch64
            runner: windows-latest
            kind: windows
            os: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc

          # Linux x86_64
          - platform: linux-x86_64
            runner: ubuntu-latest
            kind: unix
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu

          # Linux ARM64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            kind: unix
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu

          # macOS ARM64
          - platform: macos-arm64
            runner: macos-15
            kind: unix
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin

          # macOS Intel x86_64
          #
          # IMPORTANT:
          # macos-13 is retired.
          # macos-15-intel is the Intel runner.
          - platform: macos-x86_64
            runner: macos-15-intel
            kind: unix
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin

    steps:

      # ------------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------------

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------------------

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------------------
      # sccache
      # ------------------------------------------------------------------------

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      # ------------------------------------------------------------------------
      # Cargo cache
      # ------------------------------------------------------------------------

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}

          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target

          cache-all-crates: "true"
          cache-on-failure: "true"
          cache-targets: "true"

      # =========================================================================
      # WINDOWS
      # =========================================================================

      - name: Build Windows portable distribution
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "scripts/release/build_windows_dist.ps1"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Windows distribution script not found: $script"
          }

          & $script -Arch "${{ matrix.arch }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows distribution script failed with exit code $LASTEXITCODE."
          }

          $bundledToolchain = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist\windows-${{ matrix.arch }}\toolchain"

          if (Test-Path -LiteralPath $bundledToolchain) {

            Get-ChildItem `
              -LiteralPath $bundledToolchain `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Remove-Item -Force

            Get-ChildItem `
              -LiteralPath $bundledToolchain `
              -Recurse `
              -Directory `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Where-Object {
                -not (
                  Get-ChildItem `
                    -LiteralPath $_.FullName `
                    -Force `
                    -ErrorAction SilentlyContinue
                )
              } |
              Remove-Item -Force

            if (-not (
              Get-ChildItem `
                -LiteralPath $bundledToolchain `
                -Force `
                -ErrorAction SilentlyContinue
            )) {
              Remove-Item `
                -LiteralPath $bundledToolchain `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

      # ------------------------------------------------------------------------
      # Windows distribution files
      # ------------------------------------------------------------------------

      - name: Add required Windows distribution files
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"
          $stage = Join-Path $dist "windows-${{ matrix.arch }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $stage "std") |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $stage "lib") |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $stage "config") |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $stage "licenses") |
            Out-Null

          Copy-Item `
            -Path (Join-Path $root "src\stdlib\*.adesh") `
            -Destination (Join-Path $stage "std") `
            -Force

          Copy-Item `
            -Path (Join-Path $root "installer\manifests\toolchain-manifest.json") `
            -Destination (Join-Path $stage "config\toolchain-manifest.json") `
            -Force

          Copy-Item `
            -Path (Join-Path $root "LICENSE") `
            -Destination (Join-Path $stage "licenses\LICENSE.txt") `
            -Force

          $runtimeLib = Join-Path `
            $root `
            "target\release\adeshlang.lib"

          if ("${{ matrix.arch }}" -eq "aarch64") {

            $aarch64Lib = Join-Path `
              $root `
              "target\aarch64-pc-windows-msvc\release\adeshlang.lib"

            if (Test-Path -LiteralPath $aarch64Lib) {
              $runtimeLib = $aarch64Lib
            }
          }

          if (Test-Path -LiteralPath $runtimeLib) {

            Copy-Item `
              -Path $runtimeLib `
              -Destination (Join-Path $stage "lib\adeshlang.lib") `
              -Force
          }

          $versionLine = Get-Content `
            -LiteralPath (Join-Path $root "Cargo.toml") |
            Where-Object {
              $_ -match '^version = "(.+)"'
            } |
            Select-Object -First 1

          if (-not $versionLine) {
            throw "Unable to determine AdeshLang version from Cargo.toml."
          }

          $version = $versionLine `
            -replace '^version = "(.+)"', '$1'

          $oldPortable = Get-ChildItem `
            -LiteralPath $dist `
            -Filter "*windows-portable.zip" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $oldPortable) {
            throw "The Windows portable archive was not created."
          }

          $portable = Join-Path `
            $dist `
            "AdeshLang-$version-${{ matrix.arch }}-windows-portable.zip"

          Remove-Item `
            -LiteralPath $oldPortable.FullName `
            -Force

          Compress-Archive `
            -Path (Join-Path $stage "*") `
            -DestinationPath $portable `
            -Force

          if (-not (Test-Path -LiteralPath $portable)) {
            throw "Failed to create Windows portable archive."
          }

      # ------------------------------------------------------------------------
      # Windows installers
      # ------------------------------------------------------------------------

      - name: Build optional Windows installers
        if: matrix.kind == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"

          # Inno Setup
          $iss = Join-Path `
            $root `
            "installer\windows\installer.iss"

          if (Test-Path -LiteralPath $iss) {

            $iscc = (
              Get-Command `
                iscc.exe `
                -ErrorAction SilentlyContinue
            ).Source

            if (-not $iscc) {

              try {

                Write-Host "Installing Inno Setup..."

                & choco install `
                  innosetup `
                  --version=6.4.3 `
                  --yes `
                  --no-progress

                if ($LASTEXITCODE -ne 0) {
                  throw "Chocolatey exited with code $LASTEXITCODE."
                }

              }
              catch {

                Write-Warning `
                  "Inno Setup installation failed: $($_.Exception.Message)"
              }

              $iscc = (
                Get-Command `
                  iscc.exe `
                  -ErrorAction SilentlyContinue
              ).Source

              if (-not $iscc) {

                foreach ($candidate in @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe"
                )) {

                  if (Test-Path -LiteralPath $candidate) {
                    $iscc = $candidate
                    break
                  }
                }
              }
            }

            if ($iscc) {

              try {

                Write-Host "Building Inno Setup installer..."

                & $iscc $iss

                if ($LASTEXITCODE -ne 0) {
                  Write-Warning `
                    "Inno Setup failed with exit code $LASTEXITCODE."
                }

              }
              catch {

                Write-Warning `
                  "Inno Setup failed: $($_.Exception.Message)"
              }

            }
            else {

              Write-Warning `
                "ISCC.exe unavailable; skipping Inno Setup."
            }

          }
          else {

            Write-Host `
              "installer/windows/installer.iss not found; skipping Inno Setup."
          }

          # WiX
          $msiScript = Join-Path `
            $root `
            "installer\windows\msi\build-msi.ps1"

          $bundleScript = Join-Path `
            $root `
            "installer\windows\bundle\build-bundle.ps1"

          $wix = $null

          if (
            (Test-Path -LiteralPath $msiScript) -or
            (Test-Path -LiteralPath $bundleScript)
          ) {

            if (Get-Command dotnet -ErrorAction SilentlyContinue) {

              try {

                Write-Host "Installing WiX..."

                & dotnet tool install --global wix

                if ($LASTEXITCODE -ne 0) {
                  throw "dotnet tool install exited with code $LASTEXITCODE."
                }

              }
              catch {

                Write-Warning `
                  "WiX installation failed: $($_.Exception.Message)"
              }

              $env:PATH = `
                "$env:USERPROFILE\.dotnet\tools;$env:PATH"

              $wix = (
                Get-Command `
                  wix.exe `
                  -ErrorAction SilentlyContinue
              ).Source

              if (-not $wix) {

                $wix = (
                  Get-Command `
                    wix `
                    -ErrorAction SilentlyContinue
                ).Source
              }

            }
            else {

              Write-Warning `
                ".NET unavailable; cannot install WiX."
            }
          }

          if (-not $wix) {

            Write-Warning `
              "WiX unavailable; MSI/bundle builds will be skipped."
          }

          foreach ($script in @(
            $msiScript,
            $bundleScript
          )) {

            if (Test-Path -LiteralPath $script) {

              if ($wix) {

                try {

                  Write-Host "Running $script..."

                  & pwsh `
                    -NoProfile `
                    -ExecutionPolicy Bypass `
                    -File $script

                  if ($LASTEXITCODE -ne 0) {

                    Write-Warning `
                      "$script failed with exit code $LASTEXITCODE."
                  }

                }
                catch {

                  Write-Warning `
                    "$script failed: $($_.Exception.Message)"
                }
              }
            }
          }

          # Collect EXE/MSI files.
          $installerRoot = Join-Path `
            $root `
            "installer\windows"

          if (Test-Path -LiteralPath $installerRoot) {

            Get-ChildItem `
              -LiteralPath $installerRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in ".exe", ".msi"
              } |
              ForEach-Object {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination (Join-Path $dist $_.Name) `
                  -Force
              }
          }

      # =========================================================================
      # UNIX
      # =========================================================================

      - name: Build and stage Unix distribution
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml |
            head -n1
          )"

          if [ -z "$version" ]; then
            echo "::error::Unable to determine version from Cargo.toml."
            exit 1
          fi

          chmod +x scripts/release/package_unix.sh

          ./scripts/release/package_unix.sh \
            "$version" \
            "${{ matrix.arch }}" \
            "${{ matrix.os }}" \
            "${{ matrix.target }}"

          stage="$GITHUB_WORKSPACE/dist/AdeshLang-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          archive="$GITHUB_WORKSPACE/dist/AdeshLang-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.xz"

          # Remove toolchain from release archive.
          if [ -d "$stage/toolchain" ]; then
            find "$stage/toolchain" -type f -delete
            find "$stage/toolchain" -depth -type d -empty -delete
          fi

          mkdir -p \
            "$stage/std" \
            "$stage/config" \
            "$stage/licenses"

          cp src/stdlib/*.adesh "$stage/std/"

          cp \
            installer/manifests/toolchain-manifest.json \
            "$stage/config/toolchain-manifest.json"

          cp \
            LICENSE \
            "$stage/licenses/LICENSE.txt"

          rm -f "$archive"

          tar \
            -C "$GITHUB_WORKSPACE/dist" \
            -cJf "$archive" \
            "$(basename "$stage")"

          if [ ! -f "$archive" ]; then
            echo "::error::Unix archive was not created."
            exit 1
          fi

      # =========================================================================
      # LINUX PACKAGES
      # =========================================================================

      - name: Build optional Linux packages
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -u

          # Debian
          if [ -f installer/linux/deb/build-deb.sh ]; then

            if command -v dpkg-deb >/dev/null 2>&1; then

              if ! bash installer/linux/deb/build-deb.sh; then
                echo "::warning::Debian package build failed."
              fi

            else

              echo "::warning::dpkg-deb unavailable; skipping Debian package."

            fi

          else

            echo "::notice::Debian build script not found."

          fi

          # RPM
          if [ -f installer/linux/rpm/build-rpm.sh ]; then

            if ! command -v rpmbuild >/dev/null 2>&1; then

              echo "Installing RPM tooling..."

              if sudo apt-get update &&
                 sudo apt-get install -y rpm; then

                echo "RPM tooling installed."

              else

                echo "::warning::Unable to install RPM tooling."

              fi
            fi

            if ! bash installer/linux/rpm/build-rpm.sh; then
              echo "::warning::RPM package build failed."
            fi

          else

            echo "::notice::RPM build script not found."

          fi

          # Collect packages.
          mkdir -p dist

          if [ -d installer/linux ]; then

            while IFS= read -r -d '' package; do

              cp -f "$package" dist/

            done < <(
              find installer/linux \
                -type f \
                \( \
                  -name '*.deb' \
                  -o \
                  -name '*.rpm' \
                \) \
                -print0
            )

          fi

      # =========================================================================
      # macOS PACKAGES
      # =========================================================================

      - name: Build optional macOS packages
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -u

          mkdir -p dist

          # PKG
          if [ -f installer/macos/build-pkg.sh ]; then

            chmod +x installer/macos/build-pkg.sh

            if ! bash installer/macos/build-pkg.sh; then
              echo "::warning::macOS PKG build failed."
            fi

          else

            echo "::notice::macOS PKG script not found."

          fi

          # DMG
          if [ -f installer/macos/build-dmg.sh ]; then

            chmod +x installer/macos/build-dmg.sh

            if ! bash installer/macos/build-dmg.sh; then
              echo "::warning::macOS DMG build failed."
            fi

          else

            echo "::notice::macOS DMG script not found."

          fi

          # Collect PKG/DMG.
          if [ -d installer/macos ]; then

            while IFS= read -r -d '' package; do

              cp -f "$package" dist/

            done < <(
              find installer/macos \
                -type f \
                \( \
                  -name '*.pkg' \
                  -o \
                  -name '*.dmg' \
                \) \
                -print0
            )

          fi

      # =========================================================================
      # VALIDATE
      # =========================================================================

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Artifacts for ${{ matrix.platform }}"
          echo "========================================"

          if [ ! -d dist ]; then
            echo "::error::dist directory does not exist."
            exit 1
          fi

          find dist \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          archive_count="$(
            find dist \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o \
                -name '*.tar.xz' \
              \) |
            wc -l
          )"

          if [ "$archive_count" -eq 0 ]; then
            echo "::error::No core release archive was generated."
            exit 1
          fi

      # =========================================================================
      # UPLOAD ARTIFACT
      # =========================================================================

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

          path: |
            dist/*.zip
            dist/*.tar.xz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*.dmg
            dist/*.exe
            dist/*.msi

# ==============================================================================
# CHECKSUMS
# ==============================================================================

  checksums:
    name: Generate checksums

    needs:
      - build

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Check out source
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add toolchain manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            installer/manifests/toolchain-manifest.json \
            dist/toolchain-manifest.json

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          rm -f SHA256SUMS
          rm -f SHA256SUMS.txt

          if command -v sha256sum >/dev/null 2>&1; then

            while IFS= read -r -d '' file; do

              sha256sum "$file"

            done < <(
              find . \
                -maxdepth 1 \
                -type f \
                ! -name 'SHA256SUMS' \
                ! -name 'SHA256SUMS.txt' \
                -printf '%f\0' |
              sort -z
            ) > SHA256SUMS.txt

          elif command -v shasum >/dev/null 2>&1; then

            while IFS= read -r -d '' file; do

              hash="$(
                shasum -a 256 "$file" |
                awk '{print $1}'
              )"

              printf '%s  %s\n' \
                "$hash" \
                "${file#./}"

            done < <(
              find . \
                -maxdepth 1 \
                -type f \
                ! -name 'SHA256SUMS' \
                ! -name 'SHA256SUMS.txt' \
                -print0 |
              sort -z
            ) > SHA256SUMS.txt

          else

            echo "::error::No SHA256 utility available."
            exit 1

          fi

          echo "========================================"
          echo "SHA256SUMS.txt"
          echo "========================================"

          cat SHA256SUMS.txt

          test -s SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          if-no-files-found: error
          retention-days: 7
          path: dist/SHA256SUMS.txt

# ==============================================================================
# RELEASE
# ==============================================================================

  release:
    name: Publish GitHub Release

    needs:
      - checksums

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: write
      actions: read

    steps:

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate final release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final release assets"
          echo "========================================"

          find dist \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          asset_count="$(
            find dist \
              -maxdepth 1 \
              -type f |
            wc -l
          )"

          if [ "$asset_count" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          if [ ! -f dist/SHA256SUMS.txt ]; then
            echo "::error::SHA256SUMS.txt is missing."
            exit 1
          fi

      # The manifest is uploaded directly from the repository below.
      - name: Remove duplicate manifest
        shell: bash
        run: |
          rm -f dist/toolchain-manifest.json

      # ------------------------------------------------------------------------
      # Determine tag
      # ------------------------------------------------------------------------

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            echo "::error::Expected something like v0.3.1"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Release tag: $tag"

      # ------------------------------------------------------------------------
      # Create release and upload all assets
      # ------------------------------------------------------------------------

      - name: Create and publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true

          files: |
            dist/*
            installer/manifests/toolchain-manifest.json

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ==============================================================================
# AdeshLang Release Workflow
# ==============================================================================
#
# Release strategy
# ----------------
# 1. Every platform builds independently.
# 2. fail-fast is disabled.
# 3. A failed platform does not cancel other platforms.
# 4. Every successful platform uploads its own artifact.
# 5. The release job always runs after the matrix completes.
# 6. The release job downloads only artifacts that actually exist.
# 7. Therefore, successful platforms are released even when other platforms fail.
# 8. If ALL platforms fail, no GitHub Release is created.
#
# Platforms
# ---------
# Windows x86_64
# Windows ARM64
# Linux x86_64
# Linux ARM64
# macOS ARM64
# macOS Intel x86_64
#
# ==============================================================================

name: Release

# ==============================================================================
# TRIGGERS
# ==============================================================================

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.3.1"
        required: true
        type: string

# ==============================================================================
# GLOBAL ENVIRONMENT
# ==============================================================================

env:
  ADESH_REPO: adeshlang/AdeshLang
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  ADESH_SKIP_AI_MODEL: "1"

# Least-privilege default permission.
# The release job explicitly receives contents: write.
permissions:
  contents: read

# Prevent two releases for the same ref from running simultaneously.
concurrency:
  group: adesh-release-${{ github.ref }}
  cancel-in-progress: false

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  # ============================================================================
  # BUILD MATRIX
  # ============================================================================
  #
  # IMPORTANT:
  # fail-fast: false means one failed matrix entry does not cancel the others.
  #
  # ============================================================================

  build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 6

      matrix:
        include:

          # --------------------------------------------------------------------
          # Windows x86_64
          # --------------------------------------------------------------------
          - platform: windows-x86_64
            runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc

          # --------------------------------------------------------------------
          # Windows ARM64
          # --------------------------------------------------------------------
          - platform: windows-aarch64
            runner: windows-latest
            os: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc

          # --------------------------------------------------------------------
          # Linux x86_64
          # --------------------------------------------------------------------
          - platform: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu

          # --------------------------------------------------------------------
          # Linux ARM64
          # --------------------------------------------------------------------
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu

          # --------------------------------------------------------------------
          # macOS ARM64
          # --------------------------------------------------------------------
          - platform: macos-arm64
            runner: macos-15
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin

          # --------------------------------------------------------------------
          # macOS Intel x86_64
          # --------------------------------------------------------------------
          - platform: macos-x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin

    steps:

      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================================
      # RUST
      # ========================================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ========================================================================
      # SCCACHE
      # ========================================================================

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      # ========================================================================
      # CARGO CACHE
      # ========================================================================

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: adesh-release-${{ matrix.platform }}

          workspaces: |
            . -> target
            als -> als/target
            editor -> editor/target

          cache-all-crates: true
          cache-on-failure: true
          cache-targets: true

      # ========================================================================
      # AI MODEL CACHE
      # ========================================================================

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ai/models/*.gguf
          key: ai-models-${{ hashFiles('ai/models/manifest.json') }}
          restore-keys: |
            ai-models-

      # ========================================================================
      # WINDOWS DEPENDENCY CACHE
      # ========================================================================

      - name: Cache Windows tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\cache
            ~/.dotnet/tools
          key: win-tools-${{ matrix.arch }}-${{ hashFiles('installer/windows/**') }}
          restore-keys: |
            win-tools-${{ matrix.arch }}-
            win-tools-

      # ========================================================================
      # LINUX PACKAGING TOOLS
      # ========================================================================

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm dpkg-dev

      # ========================================================================
      # WINDOWS BUILD
      # ========================================================================

      - name: Build Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE

          $script = Join-Path `
            $root `
            "scripts\release\build_windows_dist.ps1"

          if (-not (Test-Path -LiteralPath $script)) {
            throw "Windows release script not found: $script"
          }

          Write-Host "========================================"
          Write-Host "AdeshLang Windows Release"
          Write-Host "Architecture: ${{ matrix.arch }}"
          Write-Host "Target: ${{ matrix.target }}"
          Write-Host "========================================"

          & $script -Arch "${{ matrix.arch }}"

          if ($LASTEXITCODE -ne 0) {
            throw `
              "build_windows_dist.ps1 failed with exit code $LASTEXITCODE."
          }

      # ========================================================================
      # WINDOWS STAGING
      # ========================================================================

      - name: Prepare Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"

          if (-not (Test-Path -LiteralPath $dist)) {
            throw "dist directory was not created."
          }

          $stage = Join-Path `
            $dist `
            "windows-${{ matrix.arch }}"

          New-Item `
            -ItemType Directory `
            -Path $stage `
            -Force |
            Out-Null

          # --------------------------------------------------------------------
          # Standard library
          # --------------------------------------------------------------------

          $stdDir = Join-Path $stage "std"

          New-Item `
            -ItemType Directory `
            -Path $stdDir `
            -Force |
            Out-Null

          $stdlib = Get-ChildItem `
            -Path (Join-Path $root "src\stdlib") `
            -Filter "*.adesh" `
            -File `
            -ErrorAction SilentlyContinue

          if ($stdlib) {
            foreach ($file in $stdlib) {
              Copy-Item `
                -LiteralPath $file.FullName `
                -Destination $stdDir `
                -Force
            }
          }

          # --------------------------------------------------------------------
          # Configuration
          # --------------------------------------------------------------------

          $configDir = Join-Path $stage "config"

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force |
            Out-Null

          $manifest = Join-Path `
            $root `
            "installer\manifests\toolchain-manifest.json"

          if (Test-Path -LiteralPath $manifest) {
            Copy-Item `
              -LiteralPath $manifest `
              -Destination $configDir `
              -Force
          }

          # --------------------------------------------------------------------
          # License
          # --------------------------------------------------------------------

          $licenseDir = Join-Path $stage "licenses"

          New-Item `
            -ItemType Directory `
            -Path $licenseDir `
            -Force |
            Out-Null

          $license = Join-Path $root "LICENSE"

          if (Test-Path -LiteralPath $license) {
            Copy-Item `
              -LiteralPath $license `
              -Destination (Join-Path $licenseDir "LICENSE.txt") `
              -Force
          }

          # --------------------------------------------------------------------
          # Remove bundled toolchain.
          #
          # AdeshLang release packages use the manifest to retrieve the
          # required toolchain instead of shipping a huge toolchain archive.
          # --------------------------------------------------------------------

          $toolchain = Join-Path $stage "toolchain"

          if (Test-Path -LiteralPath $toolchain) {

            Remove-Item `
              -LiteralPath $toolchain `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Removed bundled Windows toolchain."
          }

      # ========================================================================
      # WINDOWS OPTIONAL INSTALLERS
      # ========================================================================

      - name: Build Windows installers
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $root "dist"

          # --------------------------------------------------------------------
          # Inno Setup
          # --------------------------------------------------------------------

          $iss = Join-Path `
            $root `
            "installer\windows\installer.iss"

          if (Test-Path -LiteralPath $iss) {

            Write-Host "Inno Setup configuration found."

            $iscc = (
              Get-Command `
                iscc.exe `
                -ErrorAction SilentlyContinue
            ).Source

            if (-not $iscc) {

              Write-Host "Installing Inno Setup..."

              choco install `
                innosetup `
                --yes `
                --no-progress

              $iscc = (
                Get-Command `
                  iscc.exe `
                  -ErrorAction SilentlyContinue
              ).Source
            }

            if (-not $iscc) {

              $candidates = @(
                "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                "C:\Program Files\Inno Setup 6\ISCC.exe"
              )

              foreach ($candidate in $candidates) {

                if (Test-Path -LiteralPath $candidate) {
                  $iscc = $candidate
                  break
                }
              }
            }

            if ($iscc) {

              Write-Host "Building Inno Setup installer..."

              & $iscc $iss

              Write-Host `
                "Inno Setup exit code: $LASTEXITCODE"
            }
            else {

              Write-Warning `
                "Inno Setup compiler was not found."
            }
          }
          else {

            Write-Host `
              "No installer/windows/installer.iss found."
          }

          # --------------------------------------------------------------------
          # WiX
          # --------------------------------------------------------------------

          $msiScript = Join-Path `
            $root `
            "installer\windows\msi\build-msi.ps1"

          $bundleScript = Join-Path `
            $root `
            "installer\windows\bundle\build-bundle.ps1"

          if (
            (Test-Path -LiteralPath $msiScript) -or
            (Test-Path -LiteralPath $bundleScript)
          ) {

            if (Get-Command dotnet -ErrorAction SilentlyContinue) {

              Write-Host "Installing WiX..."

              dotnet tool install --global wix

              $env:PATH = `
                "$env:USERPROFILE\.dotnet\tools;$env:PATH"

              $wix = (
                Get-Command `
                  wix `
                  -ErrorAction SilentlyContinue
              ).Source

              if ($wix) {

                foreach ($script in @(
                  $msiScript,
                  $bundleScript
                )) {

                  if (Test-Path -LiteralPath $script) {

                    Write-Host "Running WiX script: $script"

                    & pwsh `
                      -NoProfile `
                      -ExecutionPolicy Bypass `
                      -File $script

                    Write-Host `
                      "$script exit code: $LASTEXITCODE"
                  }
                }
              }
              else {

                Write-Warning "WiX executable was not found."
              }
            }
            else {

              Write-Warning ".NET was not found. Skipping WiX."
            }
          }

          # --------------------------------------------------------------------
          # Collect generated EXE/MSI files.
          # --------------------------------------------------------------------

          $installerRoot = Join-Path `
            $root `
            "installer\windows"

          if (Test-Path -LiteralPath $installerRoot) {

            Get-ChildItem `
              -LiteralPath $installerRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in ".exe", ".msi"
              } |
              ForEach-Object {

                Copy-Item `
                  -LiteralPath $_.FullName `
                  -Destination (Join-Path $dist $_.Name) `
                  -Force
              }
          }

      # ========================================================================
      # UNIX BUILD
      # ========================================================================

      - name: Build Unix distribution
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml |
            head -n 1
          )"

          if [ -z "$version" ]; then
            echo "::error::Could not determine version from Cargo.toml."
            exit 1
          fi

          if [ ! -f "scripts/release/package_unix.sh" ]; then
            echo "::error::scripts/release/package_unix.sh was not found."
            exit 1
          fi

          chmod +x scripts/release/package_unix.sh

          echo "========================================"
          echo "AdeshLang Unix Release"
          echo "OS: ${{ matrix.os }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Target: ${{ matrix.target }}"
          echo "Version: $version"
          echo "========================================"

          ./scripts/release/package_unix.sh \
            "$version" \
            "${{ matrix.arch }}" \
            "${{ matrix.os }}" \
            "${{ matrix.target }}"

      # ========================================================================
      # MACOS INSTALLERS
      # ========================================================================

      - name: Build macOS installers
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ -f "installer/macos/build-pkg.sh" ]; then
            chmod +x installer/macos/build-pkg.sh
            echo "Building macOS .pkg..."
            ./installer/macos/build-pkg.sh "${{ matrix.arch }}" || echo "::warning::macOS .pkg build failed"
          fi

          if [ -f "installer/macos/build-dmg.sh" ]; then
            chmod +x installer/macos/build-dmg.sh
            echo "Building macOS .dmg..."
            ./installer/macos/build-dmg.sh "${{ matrix.arch }}" || echo "::warning::macOS .dmg build failed"
          fi


      # ========================================================================
      # VERIFY DIST
      # ========================================================================

      - name: Verify platform packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated artifacts"
          echo "Platform: ${{ matrix.platform }}"
          echo "========================================"

          if [ ! -d "$GITHUB_WORKSPACE/dist" ]; then
            echo "::error::dist directory does not exist."
            exit 1
          fi

          file_count=0

          # IMPORTANT:
          #
          # Do NOT use:
          #
          # find ... -printf
          #
          # because macOS uses BSD find and does not support GNU find -printf.
          #
          while IFS= read -r -d '' file; do

            echo "FILE: $(basename "$file")"

            file_count=$((file_count + 1))

          done < <(
            find \
              "$GITHUB_WORKSPACE/dist" \
              -maxdepth 1 \
              -type f \
              -print0
          )

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No release files were generated."
            exit 1
          fi

          echo ""
          echo "Generated file count: $file_count"

      # ========================================================================
      # CREATE PLATFORM CHECKSUM
      # ========================================================================
      #
      # Checksums are generated inside each platform job so the release can
      # preserve exactly which platform produced which package.
      #
      # ========================================================================

      - name: Generate platform SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          checksum_file="$GITHUB_WORKSPACE/release-output/SHA256SUMS-${{ matrix.platform }}"

          rm -f "$checksum_file"

          file_count=0

          if command -v sha256sum >/dev/null 2>&1; then

            while IFS= read -r -d '' file; do

              (
                cd "$GITHUB_WORKSPACE/dist"
                sha256sum "$(basename "$file")"
              ) >> "$checksum_file"

              file_count=$((file_count + 1))

            done < <(
              find \
                "$GITHUB_WORKSPACE/dist" \
                -maxdepth 1 \
                -type f \
                -print0
            )

          elif command -v shasum >/dev/null 2>&1; then

            while IFS= read -r -d '' file; do

              (
                cd "$GITHUB_WORKSPACE/dist"
                shasum -a 256 "$(basename "$file")"
              ) >> "$checksum_file"

              file_count=$((file_count + 1))

            done < <(
              find \
                "$GITHUB_WORKSPACE/dist" \
                -maxdepth 1 \
                -type f \
                -print0
            )

          else

            echo "::error::Neither sha256sum nor shasum is available."
            exit 1

          fi

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No files were available for checksums."
            exit 1
          fi

          sort \
            -o "$checksum_file" \
            "$checksum_file"

          echo "========================================"
          echo "SHA256SUMS - ${{ matrix.platform }}"
          echo "========================================"

          cat "$checksum_file"

      # ========================================================================
      # PREPARE ARTIFACT
      # ========================================================================

      - name: Prepare platform artifact
        shell: bash
        run: |
          set -euo pipefail

          upload_dir="$GITHUB_WORKSPACE/release-upload"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          package_count=0

          while IFS= read -r -d '' file; do
            cp "$file" "$upload_dir/"
            package_count=$((package_count + 1))
          done < <(
            find \
              "$GITHUB_WORKSPACE/dist" \
              -maxdepth 1 \
              -type f \
              -print0
          )

          if [ "$package_count" -eq 0 ]; then
            echo "::error::No package files found in dist/."
            exit 1
          fi

          checksum_file="$GITHUB_WORKSPACE/release-output/SHA256SUMS-${{ matrix.platform }}"
          if [ -f "$checksum_file" ]; then
            cp "$checksum_file" "$upload_dir/"
          fi

          echo "Packages prepared in $upload_dir:"
          ls -la "$upload_dir"

      # ========================================================================
      # UPLOAD SUCCESSFUL PLATFORM
      # ========================================================================

      - name: Upload successful platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # PUBLISH RELEASE
  # ============================================================================

  release:
    name: Publish GitHub Release

    if: ${{ always() }}

    needs:
      - build

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write
      actions: read

    steps:

      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================================
      # DETERMINE TAG
      # ========================================================================

      - name: Determine release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="${REF#refs/tags/}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            tag="v${version:-0.3.0}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # ========================================================================
      # DOWNLOAD SUCCESSFUL PLATFORM ARTIFACTS
      # ========================================================================

      - name: Download successful platform artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # ========================================================================
      # VERIFY DOWNLOADED PACKAGES
      # ========================================================================

      - name: Verify downloaded release packages
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$GITHUB_WORKSPACE/release-assets" ]; then
            echo "::error::No release artifacts were downloaded."
            echo "::error::All platform builds appear to have failed."
            exit 1
          fi

          # Flatten all subdirectories so all files sit directly at release-assets root
          find "$GITHUB_WORKSPACE/release-assets" -mindepth 2 -type f -exec mv -f {} "$GITHUB_WORKSPACE/release-assets/" \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/release-assets" -mindepth 1 -type d -empty -delete 2>/dev/null || true

          package_count=0

          echo "========================================"
          echo "Successful platform packages"
          echo "========================================"

          while IFS= read -r -d '' file; do
            echo "$(basename "$file")"
            package_count=$((package_count + 1))
          done < <(
            find \
              "$GITHUB_WORKSPACE/release-assets" \
              -maxdepth 1 \
              -type f \
              ! -name 'SHA256SUMS-*' \
              ! -name 'SHA256SUMS' \
              ! -name 'toolchain-manifest.json' \
              -print0
          )

          if [ "$package_count" -eq 0 ]; then
            echo "::error::No successful platform packages were found."
            echo "::error::No GitHub Release will be created."
            exit 1
          fi

          echo ""
          echo "Successful package count: $package_count"


      # ========================================================================
      # COMBINE CHECKSUMS
      # ========================================================================

      - name: Combine platform SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          output="$GITHUB_WORKSPACE/release-assets/SHA256SUMS"

          rm -f "$output"

          checksum_count=0

          while IFS= read -r -d '' file; do

            platform="$(basename "$file")"

            {
              echo "# ============================================================"
              echo "# $platform"
              echo "# ============================================================"
              cat "$file"
              echo ""
            } >> "$output"

            checksum_count=$((checksum_count + 1))

          done < <(
            find \
              "$GITHUB_WORKSPACE/release-assets" \
              -maxdepth 1 \
              -type f \
              -name 'SHA256SUMS-*' \
              -print0 \
            | sort -z
          )

          if [ "$checksum_count" -eq 0 ]; then

            echo "::error::No platform checksum files were found."
            exit 1

          fi

          echo "Combined checksum file:"
          cat "$output"

          # Remove per-platform checksum files.
          find \
            "$GITHUB_WORKSPACE/release-assets" \
            -maxdepth 1 \
            -type f \
            -name 'SHA256SUMS-*' \
            -delete

      # ========================================================================
      # ADD TOOLCHAIN MANIFEST
      # ========================================================================

      - name: Add toolchain manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="$GITHUB_WORKSPACE/installer/manifests/toolchain-manifest.json"

          if [ -f "$manifest" ]; then

            cp \
              "$manifest" \
              "$GITHUB_WORKSPACE/release-assets/toolchain-manifest.json"

            echo "Added toolchain-manifest.json"

          else

            echo "::warning::Toolchain manifest does not exist."

          fi

      # ========================================================================
      # FINAL ASSET LIST
      # ========================================================================

      - name: Show final release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL RELEASE ASSETS"
          echo "========================================"

          find \
            "$GITHUB_WORKSPACE/release-assets" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Total release files:"

          find \
            "$GITHUB_WORKSPACE/release-assets" \
            -maxdepth 1 \
            -type f \
            | wc -l

      # ========================================================================
      # CREATE GITHUB RELEASE
      # ========================================================================
      #
      # softprops/action-gh-release creates the release for the selected tag.
      #
      # generate_release_notes lets GitHub generate release notes automatically.
      #
      # Only files downloaded from successful build artifacts are passed here.
      #
      # ========================================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: AdeshLang ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*

      # ========================================================================
      # UPDATE DOCUMENTATION WEBSITE RELEASES & CHECKSUMS
      # ========================================================================

      - name: Update documentation website releases & checksums
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python docs-website/scripts/update-releases.py --repo "$ADESH_REPO" --tag "${{ steps.release_tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-website/ installer/manifests/
          if git diff --staged --quiet; then
            echo "Documentation already up to date."
          else
            git commit -m "docs: auto-update release assets, URLs, and checksums for ${{ steps.release_tag.outputs.tag }}"
            git push origin HEAD:${{ github.ref_name || 'main' }} || git push
            echo "Successfully updated and pushed release documentation."
          fi


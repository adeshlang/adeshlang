[workspace]
members = [
    ".",
    "als",
    "editor",
    "mobile/bridge",
    "crates/adesh-wasm",
]
resolver = "2"

[package]
name = "adeshlang"
version = "0.3.0"
edition = "2024"
autobins = false

[[bin]]
name = "adesh"
path = "src/main.rs"

[[bin]]
name = "adl"
path = "src/bin/adl.rs"

[workspace.lints.clippy]
all = "allow"

[workspace.lints.rust]
warnings = "allow"

[lints]
workspace = true

[lib]
name = "adeshlang"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
mimalloc = ["dep:mimalloc"]
# Allow HTTP requests to localhost/internal network addresses (disabled by default for SSRF protection)
allow_internal_network = []
print-bench = []

[dependencies]
colored = "2.0"
regex = "1.9"
num-bigint = "0.4"
num-traits = "0.2"
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"
chrono-tz = "0.9"
once_cell = "1"
unicode-width = "0.2"
itoa = "1.0"
ryu = "1.0"

# Cryptography dependencies
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.5"
hmac = "0.12"
hkdf = "0.12"
argon2 = "0.5"
pbkdf2 = "0.12"
scrypt = "0.11"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
subtle = "2.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "v7", "serde", "js"] }
x509-parser = "0.16"
pem = "3.0"
der = "0.7"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Compression dependencies
flate2 = "1.0"
brotli = "7.0"
zstd = "0.13"
lz4_flex = "0.11"
lzma-rs = "0.3"
zip = "2.2"
tar = "0.4"
crc32fast = "1.4"
adler2 = "2.0"

mimalloc = { version = "0.1", default-features = false, optional = true }
rpassword = "7"
crossterm = "0.27"
ratatui = "0.30"
num_cpus = "1.16"
libloading = "0.8"
libc = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# TLS and Networking dependencies
rustls = { version = "0.23", features = ["ring", "std"] }
rustls-pki-types = "1.7"
rustls-pemfile = "2.1"
webpki-roots = "0.26"
rustls-native-certs = "0.7"
rcgen = "0.13"
quinn = "0.11"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "io-util"] }
socket2 = "0.5"

# Cranelift for AOT compilation and Native JIT
cranelift = "0.110"
cranelift-codegen = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"
cranelift-object = "0.110"
cranelift-jit = "0.110"
cranelift-native = "0.110"
target-lexicon = "0.12"
wasmtime = "36.0.7"

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
libffi = "3.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
cc = "1.0"

[[bench]]
name = "benchmarks"
harness = false
path = "benches/benchmarks.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release-dev]
inherits = "dev"
opt-level = 0
lto = false
codegen-units = 256

[profile.release.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.release-pgo]
inherits = "release"
lto = "fat"

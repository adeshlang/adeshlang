[package]
name = "adesh-observatory-desktop-app"
version = "0.1.0"
description = "Adesh Observatory Desktop App"
edition = "2021"

[workspace]

[[bin]]
name = "adesh-observatory-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", default-features = false, features = ["wry"] }
tauri-plugin-shell = { version = "2.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
adesh-monitor-protocol = { path = "../../../crates/adesh-monitor-protocol" }
adesh-monitor-core = { path = "../../../crates/adesh-monitor-core" }
adesh-monitor-desktop = { path = "../../../crates/adesh-monitor-desktop" }

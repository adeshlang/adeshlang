[package]
name = "adesh-linker"
version = "0.1.0"
edition = "2024"
authors = ["AdeshLang Contributors"]
description = "Self-contained, multi-format, multi-architecture native linker for the Adesh ecosystem"
license = "Apache-2.0"
readme = "README.md"
autobins = false

[lib]
name = "adesh_linker"
path = "src/lib.rs"

[features]
default = ["monitor"]
# ARO observatory telemetry: native-only (SQLite-backed collector, OS IPC).
monitor = ["dep:adesh-monitor-protocol", "dep:adesh-monitor-core"]

[[bin]]
name = "adeshlink"
path = "src/main.rs"
required-features = ["monitor"]

[[bin]]
name = "gen_windows_exe"
path = "src/bin/gen_windows_exe.rs"
required-features = ["monitor"]

[dependencies]
adesh-object = { path = "../crates/adesh-object" }
adesh-monitor-protocol = { path = "../crates/adesh-monitor-protocol", optional = true }
adesh-monitor-core = { path = "../crates/adesh-monitor-core", optional = true }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
tempfile = "3"

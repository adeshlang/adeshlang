[package]
name = "adesh-mobile-bridge"
version = "0.3.0"
edition = "2024"
authors = ["Ajay Tainwala"]
description = "C-compatible mobile bridge for AdeshLang runtime"

[lints]
workspace = true

[lib]
name = "adesh_mobile_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
adeshlang = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
once_cell = "1"

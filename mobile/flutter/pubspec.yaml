name: adesh_mobile
description: "AdeshLang Mobile Code Editor for Android and iOS"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/examples/
    - assets/images/
    - assets/icon/
